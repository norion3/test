<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>I'm GRAVITY (GOGO! CHANCE搭載版)</title>
  <style>
    /* ---------------------------------------------------
       1. 基本設定 ＆ GRAVITY・全画面レスポンシブ可変対応
    --------------------------------------------------- */
    :root {
      --bg-color: #050508;
      --gold: #f5cf47;
      --led-red: #ff0033;
      --led-off: #200000;
      --cabinet-red: #d31820;
      --cabinet-darkred: #7a060a;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      background-color: var(--bg-color);
      color: #fff;
      font-family: "Hiragino Kaku Gothic ProN", "Meiryo", -apple-system, sans-serif;
      overflow: hidden;
      touch-action: none;
    }

    /* GRAVITY上部ヘッダー不可侵エリア対策 + Dynamic Viewport Height (100dvh) */
    .app-viewport {
      width: 100vw;
      height: 100dvh;
      padding-top: max(env(safe-area-inset-top), 8px);
      padding-bottom: max(env(safe-area-inset-bottom), 8px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .cabinet-scaler {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
    }

    /* ---------------------------------------------------
       2. ドット筐体 ＆ 赤統一・横幅390px拡大 黄金比レイアウト
    --------------------------------------------------- */
    .cabinet {
      position: relative;
      width: 390px;
      background: #111115;
      border: 4px solid #333338;
      border-radius: 12px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.95), inset 0 2px 6px rgba(255,255,255,0.2);
      padding: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      transform-origin: center center;
      transition: all 0.3s ease;
    }

    /* 画面縦幅に応じて自動縮小 */
    @media (max-height: 740px) { .cabinet { transform: scale(0.92); } }
    @media (max-height: 660px) { .cabinet { transform: scale(0.82); } }
    @media (max-height: 580px) { .cabinet { transform: scale(0.72); } }

    /* 目に優しいボーナスフラッシュ演出（フワッ、フワッとした明滅） */
    @keyframes gentleFlash {
      0% { filter: brightness(1); box-shadow: inset 0 0 20px rgba(0,0,0,0.9); }
      50% { filter: brightness(1.25); box-shadow: inset 0 0 30px rgba(255, 200, 50, 0.4), 0 0 25px rgba(255,50,50,0.3); }
      100% { filter: brightness(1); box-shadow: inset 0 0 20px rgba(0,0,0,0.9); }
    }
    .cabinet.bonus-mode .main-panel,
    .cabinet.bonus-mode .top-panel {
      animation: gentleFlash 1.5s ease-in-out infinite;
    }
    .cabinet.bonus-mode .kitac-top {
      animation: gentleFlash 1.5s ease-in-out infinite;
      background: linear-gradient(180deg, #ff3b3b 0%, #a00000 100%);
    }

    /* GRAVITY TOPランプ (赤・金統一) */
    .kitac-top {
      width: 100%;
      height: 24px;
      background: linear-gradient(180deg, #d31820 0%, #600000 100%);
      border: 2px solid #555;
      border-radius: 8px 8px 0 0;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.5s ease;
    }

    .kitac-lamp {
      width: 70%;
      height: 14px;
      background: radial-gradient(ellipse at center, #80ff80 0%, #2e7d32 70%, #003300 100%);
      border: 1.5px solid #a5d6a7;
      border-radius: 8px;
      box-shadow: 0 0 10px #4caf50;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      font-weight: 900;
      color: #003300;
      letter-spacing: 2px;
    }

    /* 上部 BIG CHANCE パネル */
    .top-panel {
      width: 100%;
      background: linear-gradient(180deg, var(--cabinet-red) 0%, #a80e14 60%, var(--cabinet-darkred) 100%);
      border: 2px solid var(--gold);
      border-radius: 4px;
      padding: 4px;
      text-align: center;
      margin-top: 4px;
      box-shadow: inset 0 0 10px rgba(0,0,0,0.8);
      transition: all 0.5s ease;
    }

    .big-chance-text {
      font-size: 20px;
      font-weight: 900;
      font-style: italic;
      color: #fff;
      text-shadow: 0 0 8px #fff, 0 0 15px #ff0000, 2px 2px 0 #000;
      letter-spacing: 2px;
    }

    .juggler-brand-bar {
      width: 100%;
      background: #000;
      border: 1px solid var(--gold);
      border-radius: 3px;
      padding: 2px 0;
      margin-top: 3px;
      font-family: 'Impact', sans-serif;
      font-size: 16px;
      letter-spacing: 6px;
      color: #fff;
      text-shadow: 0 0 6px #fff;
    }

    /* メインパネル枠 (深紅・金フチ) */
    .main-panel {
      position: relative;
      width: 100%;
      background: linear-gradient(180deg, var(--cabinet-red) 0%, var(--cabinet-darkred) 100%);
      border: 3px solid var(--gold);
      border-radius: 6px;
      padding: 8px 6px;
      margin-top: 4px;
      box-shadow: inset 0 0 20px rgba(0,0,0,0.9);
      display: flex;
      flex-direction: column;
      gap: 10px;
      transition: all 0.5s ease;
    }

    .reels-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    /* 左側ライン表示器（③②①） */
    .line-numbers {
      display: flex;
      flex-direction: column;
      gap: 20px;
      font-weight: 900;
      font-size: 10px;
    }

    .line-badge {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #333;
      background: #111;
      border: 1px solid #222;
      transition: all 0.1s ease;
    }

    .line-badge.lit.badge-3 { background: #e51d24; color: #fff; border-color: #ff8888; box-shadow: 0 0 8px #e51d24; }
    .line-badge.lit.badge-2 { background: #2196f3; color: #fff; border-color: #88ccff; box-shadow: 0 0 8px #2196f3; }
    .line-badge.lit.badge-1 { background: #4caf50; color: #fff; border-color: #88ff88; box-shadow: 0 0 8px #4caf50; }

    /* 【光学改修】重厚なリール窓枠 (強烈なインナーシャドウで上下余白を暗く沈める) */
    .reels-screen {
      width: 320px;
      height: 162px;
      background: #e8e8ed;
      border: 3px solid #111;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      overflow: hidden;
      /* 重厚な落ち影により上下余白領域を物理的に暗く沈める */
      box-shadow: inset 0 18px 16px rgba(0,0,0,0.68), inset 0 -18px 16px rgba(0,0,0,0.68);
      position: relative;
    }

    .reel-column {
      width: 104px;
      height: 162px;
      background: #f2f2f6;
      position: relative;
      overflow: hidden;
    }

    /* リール縦セパレータ (太い縦枠線) */
    .reel-separator {
      width: 2px;
      height: 100%;
      background: #0a0a0a;
      box-shadow: inset 1px 0 2px #000;
      z-index: 5;
    }

    .reel-canvas {
      position: absolute;
      top: 0; left: 0;
      width: 100px;
      will-change: transform;
    }

    /* 右側実機文字ランプ (実機完全順序: Start(赤) -> Replay(緑) -> Wait(黄)) */
    .status-panel-right {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .text-lamp {
      font-family: 'Arial Black', sans-serif;
      font-size: 8px;
      color: #2b0b0b;
      text-align: center;
      padding: 3px 2px;
      border-radius: 3px;
      background: #140505;
      border: 1px solid #3d1010;
      transition: all 0.1s ease;
    }

    .text-lamp.active.lamp-start { color: #ff3333; text-shadow: 0 0 6px #ff3333; box-shadow: 0 0 6px #ff3333; }
    .text-lamp.active.lamp-replay { color: #00ff66; text-shadow: 0 0 6px #00ff66; box-shadow: 0 0 6px #00ff66; }
    .text-lamp.active.lamp-wait { color: #ffcc00; text-shadow: 0 0 6px #ffcc00; box-shadow: 0 0 6px #ffcc00; }

    /* 下段：GOGO & 7セグ群 */
    .main-bottom-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      padding-top: 2px;
    }

    .gogo-box {
      width: 100px; 
      height: 52px;
      background: #020204;
      border: 2px solid #222;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: inset 0 0 12px #000;
    }

    .gogo-svg {
      width: 85%;
      height: 85%;
      opacity: 0.15;
      transition: all 0.05s ease-in;
    }

    .gogo-box.peka {
      background: radial-gradient(circle, #ff007f 0%, #800080 70%, #05000a 100%);
      border-color: #ff69b4;
      box-shadow: 0 0 20px #ff007f, 0 0 40px #ff007f, inset 0 0 15px #ffffff;
    }

    .gogo-box.peka .gogo-svg {
      opacity: 1;
      filter: drop-shadow(0 0 6px #fff) drop-shadow(0 0 12px #ff69b4);
      animation: pekaFlash 0.15s infinite alternate;
    }
    @keyframes pekaFlash { from { transform: scale(1); } to { transform: scale(1.03); } }

    /* ---------------------------------------------------
       3. 絶対崩れないSVGベクター 7セグメントLED
    --------------------------------------------------- */
    .led-group {
      display: flex;
      gap: 8px;
      margin-bottom: 2px;
    }

    .led-unit {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .led-label {
      font-size: 8.5px;
      color: var(--gold);
      font-weight: 900;
      margin-bottom: 3px;
    }

    .led-7seg-container {
      background: #080000;
      border: 2px solid #330000;
      border-radius: 4px;
      padding: 3px 4px;
      display: flex;
      gap: 2px;
      box-shadow: inset 0 0 8px #000;
    }

    .digit7seg {
      width: 14px;
      height: 25px;
    }
    .seg {
      fill: var(--led-off);
      transition: fill 0.05s, filter 0.05s;
    }
    .seg.lit {
      fill: var(--led-red);
      filter: drop-shadow(0 0 2px var(--led-red));
    }

    /* ---------------------------------------------------
       4. 正面視点 凹型ソケット沈み込みレバー ＆ 中央寄せストップボタン
    --------------------------------------------------- */
    .control-deck {
      width: 100%;
      background: linear-gradient(180deg, #dddddd 0%, #aaaaaa 35%, #777777 70%, #444444 100%);
      border: 2px solid #222;
      border-radius: 6px;
      padding: 10px 18px;
      margin-top: 6px;
      display: flex;
      justify-content: center; /* 【ど中央寄せ黄金レイアウト】 */
      align-items: center;
      gap: 22px;
      box-shadow: inset 0 2px 4px rgba(255,255,255,0.8), 0 5px 10px rgba(0,0,0,0.7);
    }

    .real-lever-assembly {
      position: relative;
      width: 50px;
      height: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .lever-housing {
      position: absolute;
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #ffffff 0%, #888888 60%, #111111 100%);
      border: 2px solid #222;
      box-shadow: 0 4px 8px rgba(0,0,0,0.6);
    }

    .lever-socket {
      position: absolute;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: radial-gradient(circle at 50% 50%, #050505 0%, #222222 80%, #555555 100%);
      box-shadow: inset 0 3px 6px rgba(0,0,0,0.9);
      transition: all 0.08s ease;
    }

    .lever-knob-front {
      position: relative;
      width: 25px;
      height: 25px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #ff6666 0%, #cc0000 65%, #550000 100%);
      border: 1px solid #ffaaaa;
      box-shadow: 0 3px 6px rgba(0,0,0,0.8), inset 0 -2px 4px rgba(0,0,0,0.6);
      transition: transform 0.08s ease, box-shadow 0.08s ease;
      z-index: 2;
    }

    .real-lever-assembly.hit .lever-knob-front {
      transform: translateY(4px) scale(0.88);
      box-shadow: 0 1px 2px rgba(0,0,0,0.9), inset 0 2px 4px rgba(0,0,0,0.8);
    }
    .real-lever-assembly.hit .lever-socket {
      background: radial-gradient(circle at 50% 50%, #000 0%, #151515 100%);
    }

    /* ストップボタン (数字印字完全排除・赤いプレーン仕様) */
    .stop-btn-group {
      display: flex;
      gap: 12px;
    }

    .stop-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: radial-gradient(circle, #e62229 0%, #8a0b10 100%);
      border: 2px solid #ffcccc;
      box-shadow: 0 4px 6px rgba(0,0,0,0.6);
      cursor: pointer;
      transition: transform 0.05s ease-out, border-color 0.1s;
    }
    .stop-btn.spinning { animation: btnPulse 0.3s infinite alternate; border-color: #ffff88; }
    @keyframes btnPulse { from { box-shadow: 0 0 4px #ff3333; } to { box-shadow: 0 0 12px #ff3333, inset 0 0 8px #ffffff; } }
    .stop-btn:disabled { background: radial-gradient(circle, #555 0%, #222 100%); border-color: #777; opacity: 0.4; box-shadow: none; animation: none; }
    .stop-btn:not(:disabled):active { transform: translateY(3px) scale(0.95); }

    /* ---------------------------------------------------
       5. 赤統一 下部『I'm GRAVITY』パネル ＆ 5項目常時データバー
    --------------------------------------------------- */
    .bottom-custom-panel {
      width: 100%;
      height: 42px;
      background: linear-gradient(180deg, var(--cabinet-red) 0%, var(--cabinet-darkred) 100%);
      border: 2px solid var(--gold);
      border-radius: 6px;
      margin-top: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: inset 0 0 10px rgba(0,0,0,0.8);
    }

    .custom-panel-text {
      font-family: 'Impact', sans-serif;
      font-size: 18px;
      color: var(--gold);
      letter-spacing: 4px;
      text-shadow: 0 0 8px #ffcc00, 1px 1px 2px #000;
    }

    /* 最下部：5項目 常時表示液晶風データディスプレイバー */
    .live-data-bar {
      width: 100%;
      background: #0d111a;
      border: 1.5px solid #28364a;
      border-radius: 6px;
      padding: 5px 6px;
      margin-top: 6px;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 3px;
      box-shadow: inset 0 0 8px #000;
    }

    .live-data-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #141824;
      border: 1px solid #1f2a3a;
      border-radius: 4px;
      padding: 2px 0;
    }

    .live-data-label {
      font-size: 7.5px;
      color: var(--gold);
      font-weight: bold;
      margin-bottom: 1px;
    }

    .live-data-val {
      font-family: 'Courier New', Courier, monospace;
      font-size: 11px;
      font-weight: 900;
      color: #fff;
    }

    .live-data-val.games { color: #ffffff; }
    .live-data-val.diff { color: #00e5ff; }
    .live-data-val.big { color: #ff3366; }
    .live-data-val.reg { color: #00e5ff; }
    .live-data-val.prob { color: #ffcc00; }

    /* 最下部コントロール (AUTOボタン幅固定 140px) */
    .bottom-controls {
      display: flex;
      gap: 8px;
      margin-top: 6px;
      justify-content: center;
      align-items: center;
    }

    .ctrl-btn {
      background: #222;
      border: 1px solid #555;
      color: #ccc;
      padding: 6px 10px;
      border-radius: 16px;
      font-size: 11px;
      font-weight: bold;
      cursor: pointer;
      text-align: center;
      z-index: 100;
    }

    .ctrl-btn.auto-btn { width: 140px; display: inline-block; }
    .ctrl-btn.active { background: #ffcc00; color: #000; border-color: #ffcc00; box-shadow: 0 0 8px #ffcc00; }
    .ctrl-btn.data-btn { background: linear-gradient(135deg, #8a0b10 0%, #d31820 100%); color: #fff; border-color: var(--gold); box-shadow: 0 2px 6px rgba(0,0,0,0.5); }

    /* ---------------------------------------------------
       6. 共通モーダルUI (データ ＆ 設定)
    --------------------------------------------------- */
    .modal-overlay {
      display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0,0,0,0.85); z-index: 1000; align-items: center; justify-content: center;
      backdrop-filter: blur(4px);
    }
    .modal-overlay.active { display: flex; }
    .modal-content {
      width: 90%; max-width: 420px; background: #111622; border: 2px solid #2a3447;
      border-radius: 12px; padding: 16px; color: #fff; display: flex; flex-direction: column; gap: 10px;
    }
    .modal-header { display: flex; justify-content: space-between; border-bottom: 1px solid #2a3447; padding-bottom: 6px; }
    .modal-title { font-weight: bold; color: #00e5ff; }
    .modal-close-btn { background: #222; border: 1px solid #555; color: #fff; border-radius: 50%; width: 28px; height: 28px; }
    
    .setting-row { display: flex; justify-content: space-between; align-items: center; font-size: 12px; padding: 6px 0; border-bottom: 1px solid #1a2233;}
    
    .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
    .stat-card { background: #1a2233; border-radius: 6px; padding: 6px; text-align: center; }
    .stat-label { font-size: 9px; color: #7a8ba6; }
    .stat-value { font-size: 12px; font-weight: bold; color: #fff; }
    .stat-value.big { color: #ff3366; }
    .stat-value.reg { color: #00e5ff; }
    .stat-value.total { color: #ffcc00; }
    #slumpCanvas { width: 100%; height: 150px; background: #111622; }
    .history-section { max-height: 140px; overflow-y: auto; font-size: 11px; text-align: center; }
    table { width: 100%; border-collapse: collapse; }
    th { color: #7a8ba6; border-bottom: 1px solid #2d3b54; }
    td { padding: 4px; border-bottom: 1px solid #222d42; }
  </style>

  <script src="./symbol_7.js"></script>
  <script src="./symbol_BAR.js"></script>
  <script src="./symbol_GRAPE.js"></script>
  <script src="./symbol_CHERRY.js"></script>
  <script src="./symbol_BELL.js"></script>
  <script src="./symbol_RHINO.js"></script>
  <script src="./symbol_CLOWN.js"></script>
  <script src="./datacounter.js"></script>
  <script src="./engine.js"></script>
</head>
<body>

  <!-- 全画面どこでもワンタップ進行コンテナ -->
  <div class="app-viewport" id="appViewport">
    <div class="cabinet-scaler">
      
      <!-- 横幅390px拡大 ドット筐体 -->
      <div class="cabinet" id="mainCabinet">
        
        <!-- GRAVITY TOPランプ -->
        <div class="kitac-top"><div class="kitac-lamp">GRAVITY</div></div>

        <!-- 上部 BIG CHANCE パネル -->
        <div class="top-panel">
          <div class="big-chance-text">BIG CHANCE!</div>
          <div class="juggler-brand-bar">G-SLOT</div>
        </div>

        <!-- メインパネル枠 -->
        <div class="main-panel">
          <div class="reels-row">
            <!-- ライン表示 -->
            <div class="line-numbers">
              <div class="line-badge badge-3 lit" id="lineBadge3">3</div>
              <div class="line-badge badge-2 lit" id="lineBadge2">2</div>
              <div class="line-badge badge-1 lit" id="lineBadge1">1</div>
            </div>

            <!-- 【光学改修】重厚なリール窓枠 (強烈なインナーシャドウで上下余白を暗く沈める) -->
            <div class="reels-screen">
              <div class="reel-column"><canvas id="reelCanvas0" class="reel-canvas"></canvas></div>
              <div class="reel-separator"></div>
              <div class="reel-column"><canvas id="reelCanvas1" class="reel-canvas"></canvas></div>
              <div class="reel-separator"></div>
              <div class="reel-column"><canvas id="reelCanvas2" class="reel-canvas"></canvas></div>
            </div>

            <!-- 右側文字透過パネル (Start -> Replay -> Wait の実機配列) -->
            <div class="status-panel-right">
              <div class="text-lamp lamp-start" id="lampStart">Start</div>
              <div class="text-lamp lamp-replay" id="lampReplay">Replay</div>
              <div class="text-lamp lamp-wait" id="lampWait">Wait</div>
            </div>
          </div>

          <!-- GOGOランプ ＆ SVG7セグ (COUNT 3桁仕様) -->
          <div class="main-bottom-row">
            <div class="gogo-box" id="gogoBox">
              <svg class="gogo-svg" viewBox="0 0 100 60">
                <polygon points="50,2 62,15 78,5 80,22 98,20 90,35 100,48 82,52 80,68 65,58 50,68 35,58 20,68 18,52 0,48 10,35 2,20 22,5 38,15" fill="#ff007f"/>
                <text x="50" y="26" font-family="'Impact', sans-serif" font-size="22" fill="#ffffff" font-style="italic" text-anchor="middle">GOGO!</text>
                <text x="50" y="48" font-family="'Impact', sans-serif" font-size="12" fill="#ffcc00" text-anchor="middle">CHANCE</text>
              </svg>
            </div>

            <div class="led-group">
              <!-- CREDIT (2桁) -->
              <div class="led-unit">

                  <svg class="digit7seg" viewBox="0 0 24 40" transform="skewX(-6)"><polygon class="seg seg-a" points="6,2 18,2 15,6 9,6" /><polygon class="seg seg-b" points="19,3 19,18 15,15 15,7" /><polygon class="seg seg-c" points="19,22 19,37 15,33 15,25" /><polygon class="seg seg-d" points="6,38 18,38 15,34 9,34" /><polygon class="seg seg-e" points="5,22 5,37 9,33 9,25" /><polygon class="seg seg-f" points="5,3 5,18 9,15 9,7" /><polygon class="seg seg-g" points="7,20 10,17 14,17 17,20 14,23 10,23" /></svg>
                  <svg class="digit7seg" viewBox="0 0 24 40" transform="skewX(-6)"><polygon class="seg seg-a" points="6,2 18,2 15,6 9,6" /><polygon class="seg seg-b" points="19,3 19,18 15,15 15,7" /><polygon class="seg seg-c" points="19,22 19,37 15,33 15,25" /><polygon class="seg seg-d" points="6,38 18,38 15,34 9,34" /><polygon class="seg seg-e" points="5,22 5,37 9,33 9,25" /><polygon class="seg seg-f" points="5,3 5,18 9,15 9,7" /><polygon class="seg seg-g" points="7,20 10,17 14,17 17,20 14,23 10,23" /></svg>

        <div class="control-deck">
          <div id="startBtn" class="real-lever-assembly" title="START">

          <div class="stop-btn-group">

  <!-- ホール風詳細データカウンター モーダル (各種確率追加) -->
  <div class="modal-overlay" id="dataModal">
    <div class="modal-content">
      <div class="modal-header">
        <div class="modal-title">📊 ホールデータカウンター</div>
        <button class="modal-close-btn" id="dataModalCloseBtn">✕</button>
      </div>
      <!-- 拡張3x3グリッド構成 -->
      <div class="stats-grid" style="grid-template-columns: repeat(3, 1fr);">
        <div class="stat-card"><div class="stat-label">総回転数</div><div class="stat-value" id="modalTotalGames">0 G</div></div>
        <div class="stat-card"><div class="stat-label">現在ゲーム</div><div class="stat-value" id="modalCurrentGames">0 G</div></div>
        <div class="stat-card"><div class="stat-label">差枚数</div><div class="stat-value" id="modalDiffMedal">0 枚</div></div>
        
        <div class="stat-card"><div class="stat-label">BIG 回数</div><div class="stat-value big" id="modalBigCount">0</div></div>
        <div class="stat-card"><div class="stat-label">REG 回数</div><div class="stat-value reg" id="modalRegCount">0</div></div>
        <div class="stat-card"><div class="stat-label">合成確率</div><div class="stat-value total" id="modalTotalProb">1/--.-</div></div>
        
        <div class="stat-card"><div class="stat-label">BIG 確率</div><div class="stat-value big" id="modalBigProb">1/--.-</div></div>
        <div class="stat-card"><div class="stat-label">REG 確率</div><div class="stat-value reg" id="modalRegProb">1/--.-</div></div>
        <div class="stat-card"><div class="stat-label">ブドウ確率</div><div class="stat-value total" id="modalGrapeProb">1/--.--</div></div>
      </div>
      <div style="background:#1a2233; padding:6px; border-radius:6px; text-align:center;">
        <canvas id="slumpCanvas" width="360" height="140"></canvas>
      </div>
      <div class="history-section" id="historyContainer"></div>
    </div>
  </div>

  <!-- 環境設定 モーダル -->
  <div class="modal-overlay" id="settingModal">
    <div class="modal-content">
      <div class="modal-header">
        <div class="modal-title">⚙️ 環境設定</div>
        <button class="modal-close-btn" id="settingModalCloseBtn">✕</button>
      </div>
      <div style="background:#1a2233; padding:12px; border-radius:8px;">
        <div class="setting-row">
          <label>パチスロ設定</label>
          <select id="settingSelect" style="background:#000; color:#fff; padding:4px;">
            <option value="1">設定1 (1/168.5)</option>
            <option value="2">設定2 (1/161.0)</option>
            <option value="3">設定3 (1/148.6)</option>
            <option value="4">設定4 (1/142.2)</option>
            <option value="5">設定5 (1/128.5)</option>
            <option value="6" selected>設定6 (1/127.5)</option>
          </select>
        </div>
        <div class="setting-row">
          <label>ボーナス時にAUTO解除</label>
          <input type="checkbox" id="autoBonusStopCheck" checked>
        </div>
        <div class="setting-row">
          <label>ウェイトカット</label>
          <input type="checkbox" id="weightCutCheck" checked>
        </div>
        <div class="setting-row">
          <label>サウンド再生</label>
          <input type="checkbox" id="soundEnableCheck"> <!-- 初期OFF -->
        </div>
        <div class="setting-row">
          <label>全体音量</label>
          <input type="range" id="volumeRange" min="0" max="100" value="100">
        </div>
      </div>
      <button id="saveSettingBtn" style="background:#d31820; color:#fff; border:none; padding:8px; border-radius:4px; font-weight:bold; cursor:pointer;">設定を適用</button>
    </div>
  </div>

  <script>
    document.addEventListener('touchmove', function(e) { e.preventDefault(); }, { passive: false });

    // 筐体のボーナスフラッシュ検知 MutationObserver
    const badge1 = document.getElementById('lineBadge1');
    const badge2 = document.getElementById('lineBadge2');
    const mainCabinet = document.getElementById('mainCabinet');

    if (badge1 && badge2 && mainCabinet) {
      const observer = new MutationObserver(() => {
        // ボーナス中(1BET)は中段ライン(badge2)のみが有効になる
        if (badge2.classList.contains('lit') && !badge1.classList.contains('lit')) {
          mainCabinet.classList.add('bonus-mode');
        } else {
          mainCabinet.classList.remove('bonus-mode');
        }
      });
      observer.observe(badge1, { attributes: true, attributeFilter: ['class'] });
      observer.observe(badge2, { attributes: true, attributeFilter: ['class'] });
    }

    // 全画面どこでもワンタップ進行イベント (単一窓口一元化)
    const appViewport = document.getElementById('appViewport');
    if (appViewport) {
      const handleTap = (e) => {
        if (e.target.closest('.ctrl-btn') || 
            e.target.closest('.modal-overlay') || 
            e.target.closest('.modal-content') ||
            e.target.closest('select') ||
            e.target.closest('input')) {
          return;
        }
        if (window.JUGGLER_ENGINE) {
          window.JUGGLER_ENGINE.handleTap();
        }
      };

      appViewport.addEventListener('touchstart', (e) => {
        if (e.touches && e.touches.length === 1) {
          handleTap(e);
        }
      }, { passive: false });
      appViewport.addEventListener('click', handleTap);
    }

    // データカウンターモーダル
    document.getElementById('dataBtn').onclick = (e) => {
      e.stopPropagation();
      if(window.DATA_COUNTER) {
        const s = window.DATA_COUNTER.getStats();
        document.getElementById('modalTotalGames').textContent = s.totalGames + ' G';
        document.getElementById('modalCurrentGames').textContent = s.currentGames + ' G';
        document.getElementById('modalDiffMedal').textContent = (s.diffMedal>0?'+':'') + s.diffMedal + ' 枚';
        document.getElementById('modalBigCount').textContent = s.bigCount;
        document.getElementById('modalRegCount').textContent = s.regCount;
        document.getElementById('modalTotalProb').textContent = s.totalProb;
        
        // 確率の追加表示
        document.getElementById('modalBigProb').textContent = s.bigProb;
        document.getElementById('modalRegProb').textContent = s.regProb;
        document.getElementById('modalGrapeProb').textContent = s.grapeProb;

        window.DATA_COUNTER.renderSlumpGraph(document.getElementById('slumpCanvas'));
        document.getElementById('historyContainer').innerHTML = window.DATA_COUNTER.renderHistoryHTML();
      }
      document.getElementById('dataModal').classList.add('active');
    };
    document.getElementById('dataModalCloseBtn').onclick = (e) => {
      e.stopPropagation();
      document.getElementById('dataModal').classList.remove('active');
    };

    // 設定モーダル
    document.getElementById('settingModalBtn').onclick = (e) => {
      e.stopPropagation();
      if(window.JUGGLER_ENGINE) {
        const cfg = window.JUGGLER_ENGINE.getConfig();
        document.getElementById('settingSelect').value = cfg.setting;
        document.getElementById('autoBonusStopCheck').checked = cfg.autoStopOnBonus;
        document.getElementById('weightCutCheck').checked = cfg.weightCut;
        document.getElementById('volumeRange').value = Math.round(cfg.volume * 100);
        document.getElementById('soundEnableCheck').checked = cfg.soundOn;
      }
      document.getElementById('settingModal').classList.add('active');
    };
    document.getElementById('settingModalCloseBtn').onclick = (e) => {
      e.stopPropagation();
      document.getElementById('settingModal').classList.remove('active');
    };
    document.getElementById('saveSettingBtn').onclick = (e) => {
      e.stopPropagation();
      if(window.JUGGLER_ENGINE) {
        window.JUGGLER_ENGINE.setConfig({
          setting: parseInt(document.getElementById('settingSelect').value, 10),
          autoStopOnBonus: document.getElementById('autoBonusStopCheck').checked,
          weightCut: document.getElementById('weightCutCheck').checked,
          volume: parseFloat(document.getElementById('volumeRange').value) / 100,
          soundOn: document.getElementById('soundEnableCheck').checked
        });
      }
      document.getElementById('settingModal').classList.remove('active');
    };

    document.querySelectorAll('.modal-overlay').forEach(m => m.onclick = (e) => { if(e.target === m) m.classList.remove('active'); });

    // エンジン起動
    function bootEngine() {
      if(window.DATA_COUNTER) window.DATA_COUNTER.init();
      if(window.JUGGLER_ENGINE) window.JUGGLER_ENGINE.init();
    }
    if (document.readyState === 'complete' || document.readyState === 'interactive') bootEngine();
    else window.addEventListener('DOMContentLoaded', bootEngine);
  </script>
</body>
</html>
