<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>アイムジャグラーEX 実写オーバーレイ完全版</title>
  <style>
    /* ---------------------------------------------------
       1. 基本設定＆スマホ誤操作防止プロテクト
    --------------------------------------------------- */
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    body {
      background-color: #050508;
      color: #fff;
      font-family: "Hiragino Kaku Gothic ProN", "Meiryo", -apple-system, sans-serif;
      margin: 0;
      padding: 10px 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100vh;
      overflow: hidden; 
      overscroll-behavior: none;
      touch-action: none; /* スマホのスクロール・ズームを遮断 */
    }

    /* ---------------------------------------------------
       2. 画像に対するオーバーレイ相対位置 (パーセンテージ)
       ※写真の位置と合致するようにパーセンテージで定義
    --------------------------------------------------- */
    :root {
      /* リール窓位置 */
      --reel-top: 29.3%;
      --reel-left: 17.2%;
      --reel-width: 65.6%;
      --reel-height: 20.2%;
      
      /* GOGO! CHANCE ランプ位置 */
      --gogo-top: 41.2%;
      --gogo-left: 8.8%;
      --gogo-width: 17.5%;
      --gogo-height: 8.2%;

      /* 7セグLED (CREDIT / COUNT / PAYOUT) 位置 */
      --seg-top: 51.8%;
      --seg-credit-left: 32.2%;
      --seg-count-left: 45.2%;
      --seg-payout-left: 58.2%;
      --seg-width: 9.5%;
      --seg-height: 4.8%;

      /* 操作部 (BET / レバー / ストップ1・2・3) 位置 */
      --bet-top: 55.2%;
      --bet-left: 3.2%;
      --bet-width: 9.2%;
      --bet-height: 5.2%;

      --lever-top: 53.8%;
      --lever-left: 13.5%;
      --lever-width: 10.8%;
      --lever-height: 6.2%;

      --stop-top: 54.2%;
      --stop-width: 10.2%;
      --stop-height: 5.8%;
      --stop1-left: 34.8%;
      --stop2-left: 49.2%;
      --stop3-left: 63.8%;
    }

    /* ---------------------------------------------------
       3. 筐体メインコンテナ (実写写真ベース)
    --------------------------------------------------- */
    .cabinet-container {
      position: relative;
      width: 100%;
      max-width: 440px; /* 画面サイズに合わせた上限 */
      margin: 0 auto;
      box-shadow: 0 10px 30px rgba(0,0,0,0.9);
      border-radius: 8px;
      overflow: hidden;
    }

    .cabinet-bg {
      display: block;
      width: 100%;
      height: auto;
      pointer-events: none; /* 背景画像の誤タッチ防止 */
    }

    /* ---------------------------------------------------
       4. リール窓（写真のリール位置に正確に重ね合わせ）
    --------------------------------------------------- */
    .reels-overlay {
      position: absolute;
      top: var(--reel-top);
      left: var(--reel-left);
      width: var(--reel-width);
      height: var(--reel-height);
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      border-radius: 2px;
      overflow: hidden;
      box-shadow: inset 0 8px 12px rgba(0,0,0,0.8), inset 0 -8px 12px rgba(0,0,0,0.8);
    }

    .reels-container {
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: space-between;
    }

    .reel-column {
      width: 32.8%;
      height: 100%;
      background: #ffffff;
      position: relative;
      overflow: hidden;
    }

    .reel-canvas {
      width: 100%;
      position: absolute;
      top: 0; 
      left: 0;
      will-change: transform;
    }

    /* ---------------------------------------------------
       5. 7セグLED & GOGO! CHANCE 発光部
    --------------------------------------------------- */
    .seg-overlay {
      position: absolute;
      top: var(--seg-top);
      width: var(--seg-width);
      height: var(--seg-height);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ff1111;
      font-family: 'Courier New', Courier, monospace;
      font-weight: 900;
      font-size: clamp(12px, 3.8vw, 18px);
      text-shadow: 0 0 6px #ff1111, 0 0 10px #ff1111;
      pointer-events: none;
    }

    .seg-credit { left: var(--seg-credit-left); }
    .seg-count { left: var(--seg-count-left); }
    .seg-payout { left: var(--seg-payout-left); }

    .gogo-overlay {
      position: absolute;
      top: var(--gogo-top);
      left: var(--gogo-left);
      width: var(--gogo-width);
      height: var(--gogo-height);
      opacity: 0;
      transition: opacity 0.05s ease-in;
      pointer-events: none;
      display: flex;
      align-items: center;
      justify-content: center;
      mix-blend-mode: screen; /* 写真背景になじませる透過合成 */
    }

    .gogo-overlay.peka {
      opacity: 1;
      animation: pekaFlash 0.15s infinite alternate;
      background: radial-gradient(ellipse, rgba(255, 0, 127, 0.95) 0%, rgba(255, 0, 127, 0.2) 65%, transparent 100%);
    }

    @keyframes pekaFlash {
      from { filter: brightness(1); }
      to { filter: brightness(1.35); }
    }

    .gogo-svg {
      width: 92%;
      height: 92%;
      filter: drop-shadow(0 0 6px #ff007f);
    }

    /* ---------------------------------------------------
       6. 透明操作ボタン（写真のボタン上に配置）
    --------------------------------------------------- */
    .touch-btn {
      position: absolute;
      border-radius: 50%;
      background: transparent;
      outline: none;
      border: none;
      cursor: pointer;
      touch-action: manipulation;
      z-index: 10;
      transition: background 0.05s, box-shadow 0.05s;
    }

    /* タップした瞬間にボタンが沈み込む影のリアル演出 */
    .touch-btn:active {
      background: rgba(0, 0, 0, 0.35);
      box-shadow: inset 0 4px 12px rgba(0,0,0,0.8);
    }

    .touch-btn:disabled {
      background: transparent;
      cursor: not-allowed;
    }

    .btn-bet { top: var(--bet-top); left: var(--bet-left); width: var(--bet-width); height: var(--bet-height); }
    .btn-lever { top: var(--lever-top); left: var(--lever-left); width: var(--lever-width); height: var(--lever-height); }
    .btn-stop1 { top: var(--stop-top); left: var(--stop1-left); width: var(--stop-width); height: var(--stop-height); }
    .btn-stop2 { top: var(--stop-top); left: var(--stop2-left); width: var(--stop-width); height: var(--stop-height); }
    .btn-stop3 { top: var(--stop-top); left: var(--stop3-left); width: var(--stop-width); height: var(--stop-height); }

    /* ---------------------------------------------------
       7. 筐体下部サブコントロール
    --------------------------------------------------- */
    .bottom-controls {
      display: flex;
      gap: 12px;
      margin-top: 12px;
      align-items: center;
    }

    .ctrl-btn {
      background: #1e1e24;
      border: 1px solid #444;
      color: #ddd;
      padding: 6px 14px;
      border-radius: 16px;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 2px 5px rgba(0,0,0,0.5);
    }

    .ctrl-btn.setting {
      color: #f5cf47;
      border-color: #f5cf47;
    }
  </style>

  <!-- 各種スクリプトデータの読み込み -->
  <script src="./symbol_7.js"></script>
  <script src="./symbol_BAR.js"></script>
  <script src="./symbol_GRAPE.js"></script>
  <script src="./symbol_CHERRY.js"></script>
  <script src="./symbol_BELL.js"></script>
  <script src="./symbol_RHINO.js"></script>
  <script src="./symbol_CLOWN.js"></script>
  <script src="./engine.js"></script>
</head>
<body>

  <!-- 実写筐体コンテナ -->
  <div class="cabinet-container">
    <!-- 背景：実写写真 -->
    <img src="./image.png" alt="アイムジャグラーEX 筐体写真" class="cabinet-bg" id="cabinetBg">

    <!-- リール窓オーバーレイ -->
    <div class="reels-overlay">
      <div class="reels-container">
        <div class="reel-column"><canvas id="reelCanvas0" class="reel-canvas"></canvas></div>
        <div class="reel-column"><canvas id="reelCanvas1" class="reel-canvas"></canvas></div>
        <div class="reel-column"><canvas id="reelCanvas2" class="reel-canvas"></canvas></div>
      </div>
    </div>

    <!-- 7セグLED表示 (CREDIT / COUNT / PAYOUT) -->
    <div class="seg-overlay seg-credit" id="creditDisp">50</div>
    <div class="seg-overlay seg-count" id="countDisp">0</div>
    <div class="seg-overlay seg-payout" id="payoutDisp">0</div>

    <!-- GOGO! CHANCE ランプ発光層 -->
    <div class="gogo-overlay" id="gogoBox">
      <svg class="gogo-svg" viewBox="0 0 100 60">
        <polygon points="50,2 62,15 78,5 80,22 98,20 90,35 100,48 82,52 80,68 65,58 50,68 35,58 20,68 18,52 0,48 10,35 2,20 22,5 38,15" fill="#ff007f"/>
        <text x="50" y="26" font-family="'Impact', sans-serif" font-size="22" fill="#ffffff" font-style="italic" text-anchor="middle" filter="drop-shadow(0 0 3px #fff)">GOGO!</text>
        <text x="50" y="48" font-family="'Impact', sans-serif" font-size="12" fill="#ffcc00" text-anchor="middle">CHANCE</text>
      </svg>
    </div>

    <!-- 透明タッチボタン（実機写真のボタン位置に重ね配置） -->
    <button id="betBtn" class="touch-btn btn-bet" title="3BET"></button>
    <button id="startBtn" class="touch-btn btn-lever" title="START"></button>
    <button id="stopBtn0" class="touch-btn btn-stop1" title="STOP 1" disabled></button>
    <button id="stopBtn1" class="touch-btn btn-stop2" title="STOP 2" disabled></button>
    <button id="stopBtn2" class="touch-btn btn-stop3" title="STOP 3" disabled></button>
  </div>

  <!-- 下部補助コントロール -->
  <div class="bottom-controls">
    <button id="soundToggle" class="ctrl-btn">🔊 サウンド: ON</button>
    <button id="settingToggle" class="ctrl-btn setting">⚙️ 設定: 6</button>
  </div>

  <script>
    // エンジンの安全な自動起動
    function bootEngine() {
      if (window.JUGGLER_ENGINE && !window.JUGGLER_ENGINE.isInitialized) {
        window.JUGGLER_ENGINE.init();
      }
    }

    if (document.readyState === 'complete' || document.readyState === 'interactive') {
      bootEngine();
    } else {
      window.addEventListener('DOMContentLoaded', bootEngine);
      window.addEventListener('load', bootEngine);
    }
  </script>
</body>
</html>
