<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>アイムジャグラーEX 完全再現ドットスロット</title>
  <style>
    :root {
      --bg-color: #08080a;
      --cabinet-silver: linear-gradient(180deg, #e6e6e6 0%, #b8b8b8 40%, #8a8a8a 70%, #5e5e5e 100%);
      --gold: #f5cf47;
      --led-red: #ff1111;
    }

    * {
      box-sizing: border-box;
      /* スマホ操作完全プロテクト: テキスト選択・長押しメニュー禁止 */
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    body {
      background-color: var(--bg-color);
      color: #fff;
      font-family: "Hiragino Kaku Gothic ProN", "Meiryo", -apple-system, sans-serif;
      margin: 0;
      padding: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      /* バウンス(引っ張り)スクロールとズームをCSSレベルで完全遮断 */
      overflow: hidden; 
      overscroll-behavior: none;
      touch-action: none;
    }

    /* 筐体フレーム */
    .cabinet {
      position: relative;
      width: 100%;
      max-width: 410px;
      background: #111;
      border: 4px solid #666;
      border-radius: 12px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.95), inset 0 2px 6px rgba(255,255,255,0.5);
      padding: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* 筐体最上部 (KITAC グリーンランプ) */
    .kitac-top {
      width: 100%;
      height: 28px;
      background: linear-gradient(180deg, #d31b22 0%, #900a0f 100%);
      border: 2px solid #555;
      border-radius: 8px 8px 0 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .kitac-lamp {
      width: 70%;
      height: 16px;
      background: radial-gradient(ellipse at center, #80ff80 0%, #2e7d32 70%, #003300 100%);
      border: 2px solid #a5d6a7;
      border-radius: 10px;
      box-shadow: 0 0 10px #4caf50;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      font-weight: 900;
      color: #003300;
      letter-spacing: 1px;
    }

    /* 上部パネル */
    .top-panel {
      width: 100%;
      background: linear-gradient(180deg, #e62229 0%, #a80e14 70%, #5e0205 100%);
      border: 3px solid var(--gold);
      border-radius: 4px;
      padding: 6px;
      text-align: center;
      margin-top: 4px;
      box-shadow: inset 0 0 12px rgba(0,0,0,0.7);
    }

    .big-chance-text {
      font-size: 20px;
      font-weight: 900;
      font-style: italic;
      color: #fff;
      text-shadow: 0 0 8px #fff, 0 0 15px #ff0000, 2px 2px 0 #000;
      letter-spacing: 2px;
    }

    .top-777-container {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin-top: 2px;
    }

    .top-7-img {
      width: 60px;
      height: 24px;
      filter: drop-shadow(0 0 5px #ff0000);
    }

    .juggler-brand-bar {
      width: 100%;
      background: #000;
      border: 1px solid var(--gold);
      border-radius: 3px;
      padding: 2px 0;
      margin-top: 4px;
      font-family: 'Impact', sans-serif;
      font-size: 18px;
      letter-spacing: 4px;
      color: #fff;
      text-shadow: 0 0 6px #fff;
    }

    /* 中央メイン枠 */
    .center-frame {
      position: relative;
      width: 100%;
      background: linear-gradient(180deg, #d31820 0%, #800a0e 100%);
      border: 3px solid var(--gold);
      border-radius: 6px;
      padding: 8px;
      margin-top: 4px;
      box-shadow: inset 0 0 15px rgba(0,0,0,0.8);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .reels-wrapper {
      width: 100%;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: flex-end;
    }

    .line-numbers {
      position: absolute;
      left: 6px;
      top: 35px;
      display: flex;
      flex-direction: column;
      gap: 30px;
      font-weight: 900;
      font-size: 12px;
    }
    .line-badge {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      box-shadow: 0 0 4px rgba(0,0,0,0.9);
      border: 1px solid #fff;
    }
    .badge-3 { background: #e51d24; }
    .badge-2 { background: #2196f3; }
    .badge-1 { background: #4caf50; }

    /* リール窓：レスポンシブ縮小によるズレを防止する「絶対固定ピクセル(304x210)」 */
    .reels-screen {
      width: 304px;  /* 100px×3列 ＋ 隙間2px×2 ＝ 304px */
      height: 210px; /* 70px×3コマ ＝ 210px */
      box-sizing: content-box;
      background: #111; /* リール間の隙間を実機同様の黒に */
      border: 3px solid #222;
      border-radius: 4px;
      display: flex;
      justify-content: space-between;
      overflow: hidden;
      box-shadow: inset 0 12px 14px rgba(0,0,0,0.4), inset 0 -12px 14px rgba(0,0,0,0.4);
      position: relative;
    }

    /* 各リール列：グレー線削除済、完全な純白100px幅 */
    .reel-column {
      width: 100px;
      height: 100%;
      background: #fff;
      position: relative;
      overflow: hidden;
    }

    .reel-canvas {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      will-change: transform;
    }

    /* ダッシュボード */
    .dashboard-bar {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      margin-top: 8px;
      padding: 0 2px;
    }

    .gogo-box {
      width: 110px; height: 60px;
      background: #020204;
      border: 2px solid #222;
      border-radius: 6px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      box-shadow: inset 0 0 12px #000;
    }

    .gogo-star-bg { position: absolute; width: 90%; height: 90%; opacity: 0.15; transition: all 0.05s ease-in; }
    .gogo-text-svg { width: 85%; height: 70%; opacity: 0.15; transition: all 0.05s ease-in; }

    .gogo-box.peka {
      background: radial-gradient(circle, #ff007f 0%, #800080 70%, #05000a 100%);
      border-color: #ff69b4;
      box-shadow: 0 0 20px #ff007f, 0 0 40px #ff007f, inset 0 0 15px #ffffff;
    }
    .gogo-box.peka .gogo-star-bg { opacity: 1; filter: drop-shadow(0 0 8px #ff007f); }
    .gogo-box.peka .gogo-text-svg { opacity: 1; filter: drop-shadow(0 0 6px #fff) drop-shadow(0 0 12px #ff69b4); animation: pekaFlash 0.15s infinite alternate; }

    @keyframes pekaFlash {
      from { transform: scale(1); }
      to { transform: scale(1.03); }
    }

    .led-group { display: flex; gap: 8px; }
    .led-unit { display: flex; flex-direction: column; align-items: center; }
    .led-label { font-size: 8px; color: var(--gold); font-weight: 900; margin-bottom: 2px; }
    .led-screen {
      background: #000; border: 1px solid #444; border-radius: 3px;
      padding: 2px 5px; font-family: 'Courier New', Courier, monospace;
      font-size: 17px; font-weight: bold; color: var(--led-red);
      text-shadow: 0 0 6px var(--led-red); min-width: 38px; text-align: right;
    }

    /* 操作デッキ */
    .control-deck {
      width: 100%;
      background: var(--cabinet-silver);
      border: 2px solid #333; border-radius: 6px;
      padding: 10px; margin-top: 6px;
      display: flex; justify-content: space-between; align-items: center;
      box-shadow: inset 0 2px 4px rgba(255,255,255,0.8), 0 4px 8px rgba(0,0,0,0.6);
    }
    .bet-btn {
      width: 46px; height: 46px; border-radius: 50%;
      background: radial-gradient(circle, #ff3333 0%, #880000 100%);
      border: 2px solid #fff; color: #fff; font-weight: 900; font-size: 11px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.6); cursor: pointer;
      display: flex; align-items: center; justify-content: center; text-align: center;
    }
    .bet-btn:active { transform: translateY(2px); }
    .lever-btn {
      width: 44px; height: 44px; border-radius: 50%;
      background: radial-gradient(circle, #ffffff 0%, #a0a0a0 100%);
      border: 3px solid #222; box-shadow: 0 5px 10px rgba(0,0,0,0.7);
      cursor: pointer; transition: transform 0.08s;
    }
    .lever-btn:active { transform: translateY(6px) scale(0.95); }
    .stop-btn-group { display: flex; gap: 8px; }
    .stop-btn {
      width: 42px; height: 42px; border-radius: 50%;
      background: radial-gradient(circle, #e62229 0%, #8a0b10 100%);
      border: 2px solid #ffcccc; color: #fff; font-weight: 900; font-size: 13px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.6); cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }
    .stop-btn:disabled {
      background: radial-gradient(circle, #555 0%, #222 100%);
      border-color: #777; opacity: 0.5; cursor: not-allowed; box-shadow: none;
    }
    .stop-btn:not(:disabled):active { transform: translateY(2px); }

    .clown-bottom-panel {
      width: 100%; background: linear-gradient(180deg, #d31820 0%, #7d080d 100%);
      border: 3px solid var(--gold); border-radius: 6px;
      margin-top: 6px; padding: 10px 6px;
      display: flex; flex-direction: column; align-items: center;
      box-shadow: inset 0 0 12px rgba(0,0,0,0.7);
    }
    .clown-svg-graphic { width: 100%; max-height: 110px; }
    .sound-btn { margin-top: 6px; background: #222; border: 1px solid #555; color: #ccc; padding: 4px 12px; border-radius: 12px; font-size: 11px; cursor: pointer; }
  </style>

  <!-- 【重要】エンジンロジックを全てここに統合し、キャッシュ問題を完全撲滅 -->
  <script>
    // --- スマホ操作プロテクト用スクリプト ---
    // iOS Safari等のスクロール・引っ張りを強制遮断
    document.addEventListener('touchmove', function(event) {
      event.preventDefault();
    }, { passive: false });

    // ピンチズーム（2本指での拡大）を強制遮断
    document.addEventListener('gesturestart', function(event) {
      event.preventDefault();
    });

    // ダブルタップでの意図せぬ画面拡大を強制遮断
    document.addEventListener('dblclick', function(event) {
      event.preventDefault();
    }, { passive: false });


    // --- メインエンジンロジック ---
    const REEL_STRIPS = [
      ['BAR', 'GRAPE', 'RHINO', 'GRAPE', 'BELL', '7', 'RHINO', 'GRAPE', 'RHINO', 'GRAPE', 'BAR', 'CHERRY', 'GRAPE', 'RHINO', 'GRAPE', '7', 'CLOWN', 'GRAPE', 'RHINO', 'GRAPE', 'CHERRY'],
      ['RHINO', 'BELL', 'GRAPE', 'CHERRY', 'RHINO', '7', 'GRAPE', 'CHERRY', 'RHINO', 'BELL', 'GRAPE', 'CHERRY', 'RHINO', 'BAR', 'GRAPE', 'CHERRY', 'CLOWN', 'RHINO', '7', 'GRAPE', 'CHERRY'],
      ['GRAPE', 'CLOWN', 'BELL', 'RHINO', 'GRAPE', '7', 'BAR', 'BELL', 'RHINO', 'GRAPE', 'CLOWN', 'BELL', 'RHINO', 'GRAPE', 'CLOWN', 'BELL', 'RHINO', 'GRAPE', 'CLOWN', 'BELL', 'RHINO']
    ];

    const SYMBOL_HEIGHT = 70;
    const CANVAS_WIDTH = 100;
    const REEL_SPEED_BASE = 33; // 整数値で1回転0.75秒の実機同期スピード

    let credits = 50;
    let betAmount = 0;
    let gamesCount = 0;
    let isSpinning = false;
    let bonusState = null;
    let isPeka = false;
    let soundOn = true;
    let audioCtx = null;
    let reels = [];

    const symbolCanvasCache = {};

    function decodeRLEToCanvas(symData) {
      const cvs = document.createElement('canvas');
      cvs.width = 128; cvs.height = 128;
      const ctx = cvs.getContext('2d');
      ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, 128, 128);
      if (!symData || !symData.rle) return cvs;

      const imgData = ctx.createImageData(symData.w, symData.h);
      const data = imgData.data;
      const palette = symData.palette;
      const chunks = symData.rle.split(',');

      let pixelIndex = 0;
      for (let i = 0; i < chunks.length; i++) {
        const parts = chunks[i].split(':');
        const colorIdx = parseInt(parts[0], 10);
        const count = parseInt(parts[1], 10);
        const hex = palette[colorIdx] || '#ffffff';

        const r = parseInt(hex.substring(1, 3), 16) || 255;
        const g = parseInt(hex.substring(3, 5), 16) || 255;
        const b = parseInt(hex.substring(5, 7), 16) || 255;

        for (let c = 0; c < count; c++) {
          const idx = pixelIndex * 4;
          data[idx] = r; data[idx+1] = g; data[idx+2] = b; data[idx+3] = 255;
          pixelIndex++;
        }
      }
      ctx.putImageData(imgData, symData.x, symData.y);
      return cvs;
    }

    function initSymbolCache() {
      const ALL_IDS = ['7', 'BAR', 'GRAPE', 'CHERRY', 'BELL', 'RHINO', 'CLOWN'];
      const dataStore = window.SLOT_SYMBOLS_DATA || {};

      ALL_IDS.forEach(id => {
        if (dataStore[id]) {
          symbolCanvasCache[id] = { canvas: decodeRLEToCanvas(dataStore[id]), meta: dataStore[id] };
        } else {
          const cvs = document.createElement('canvas');
          cvs.width = 128; cvs.height = 128;
          const ctx = cvs.getContext('2d');
          ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, 128, 128);
          ctx.fillStyle = '#000000'; ctx.font = 'bold 24px sans-serif';
          ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
          ctx.fillText(id, 64, 64);
          symbolCanvasCache[id] = { canvas: cvs, meta: { x: 0, y: 0, w: 128, h: 128 } };
        }
      });
    }

    function drawSymbol(ctx, type, y, isReelSpinning = false) {
      const cached = symbolCanvasCache[type];
      ctx.save();
      ctx.translate(0, y);
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(0, 0, CANVAS_WIDTH, SYMBOL_HEIGHT);

      if (cached) {
        let maxW = (type === '7' || type === 'BAR') ? CANVAS_WIDTH * 0.88 : CANVAS_WIDTH * 0.45;
        let maxH = (type === '7' || type === 'BAR') ? SYMBOL_HEIGHT * 0.88 : SYMBOL_HEIGHT * 0.50;

        const scale = Math.min(maxW / cached.meta.w, maxH / cached.meta.h);
        const drawW = cached.meta.w * scale;
        const drawH = cached.meta.h * scale;
        const drawX = (CANVAS_WIDTH - drawW) / 2;
        const drawY = (SYMBOL_HEIGHT - drawH) / 2;

        ctx.imageSmoothingEnabled = true;
        ctx.imageSmoothingQuality = 'high';

        // 7とBARの回転中透過発光エフェクト
        if (isReelSpinning) {
          if (type === '7') {
            ctx.shadowColor = 'rgba(255, 30, 30, 0.95)';
            ctx.shadowBlur = 14;
          } else if (type === 'BAR') {
            ctx.shadowColor = 'rgba(255, 255, 255, 0.95)';
            ctx.shadowBlur = 12;
          } else {
            ctx.shadowColor = 'transparent'; ctx.shadowBlur = 0;
          }
        } else {
          ctx.shadowColor = 'transparent'; ctx.shadowBlur = 0;
        }

        ctx.drawImage(cached.canvas, cached.meta.x, cached.meta.y, cached.meta.w, cached.meta.h, drawX, drawY, drawW, drawH);
      }
      ctx.restore();
    }

    function initAudio() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }

    function playSound(type) {
      if (!soundOn || !audioCtx) return;
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain); gain.connect(audioCtx.destination);

      if (type === 'lever') {
        osc.type = 'sawtooth'; osc.frequency.setValueAtTime(280, now); osc.frequency.exponentialRampToValueAtTime(50, now + 0.08);
        gain.gain.setValueAtTime(0.3, now); gain.gain.linearRampToValueAtTime(0.01, now + 0.08);
        osc.start(now); osc.stop(now + 0.08);
      } else if (type === 'stop') {
        osc.type = 'triangle'; osc.frequency.setValueAtTime(140, now); osc.frequency.exponentialRampToValueAtTime(30, now + 0.06);
        gain.gain.setValueAtTime(0.4, now); gain.gain.linearRampToValueAtTime(0.01, now + 0.06);
        osc.start(now); osc.stop(now + 0.06);
      } else if (type === 'gako') {
        osc.type = 'square'; osc.frequency.setValueAtTime(750, now); osc.frequency.exponentialRampToValueAtTime(90, now + 0.14);
        gain.gain.setValueAtTime(0.8, now); gain.gain.linearRampToValueAtTime(0.01, now + 0.14);
        osc.start(now); osc.stop(now + 0.14);
      } else if (type === 'pay') {
        osc.type = 'sine'; osc.frequency.setValueAtTime(880, now); osc.frequency.setValueAtTime(1760, now + 0.04);
        gain.gain.setValueAtTime(0.2, now); gain.gain.linearRampToValueAtTime(0.01, now + 0.08);
        osc.start(now); osc.stop(now + 0.08);
      }
    }

    // オートチャージ機能搭載（クレジットが3未満なら自動で50に補給）
    function updateDisplays(payout = 0) {
      if (credits < 3) credits = 50;
      const cEl = document.getElementById('creditDisp');
      const gEl = document.getElementById('countDisp');
      const pEl = document.getElementById('payoutDisp');
      if (cEl) cEl.textContent = credits;
      if (gEl) gEl.textContent = gamesCount;
      if (pEl) pEl.textContent = payout;
    }

    window.JUGGLER_ENGINE = {
      isInitialized: false,
      init: function() {
        if (this.isInitialized) return;
        initSymbolCache();

        reels = REEL_STRIPS.map((strip, idx) => {
          const canvas = document.getElementById(`reelCanvas${idx}`);
          if (!canvas) return null;
          canvas.width = CANVAS_WIDTH;
          canvas.height = SYMBOL_HEIGHT * strip.length * 3;
          const ctx = canvas.getContext('2d');
          const tripleStrip = [...strip, ...strip, ...strip];
          
          tripleStrip.forEach((sym, i) => { drawSymbol(ctx, sym, i * SYMBOL_HEIGHT, false); });
          const currentIdx = Math.floor(Math.random() * strip.length);
          const initialPos = currentIdx * SYMBOL_HEIGHT;
          canvas.style.transform = `translateY(-${initialPos}px)`;

          return {
            id: idx, strip: strip, canvas: canvas, ctx: ctx,
            currentIndex: currentIdx, isSpinning: false, isStopping: false,
            speed: 0, pos: initialPos, targetPos: 0, animId: null
          };
        }).filter(Boolean);

        updateDisplays();
        this.bindEvents();
        this.isInitialized = true;
      },

      renderReelCanvas: function(reel, isSpinning) {
        const tripleStrip = [...reel.strip, ...reel.strip, ...reel.strip];
        reel.ctx.clearRect(0, 0, reel.canvas.width, reel.canvas.height);
        tripleStrip.forEach((sym, i) => { drawSymbol(reel.ctx, sym, i * SYMBOL_HEIGHT, isSpinning); });
      },

      bindEvents: function() {
        const betBtn = document.getElementById('betBtn');
        const startBtn = document.getElementById('startBtn');
        const stopBtns = [
          document.getElementById('stopBtn0'),
          document.getElementById('stopBtn1'),
          document.getElementById('stopBtn2')
        ];
        const soundToggle = document.getElementById('soundToggle');

        if (betBtn) {
          betBtn.onclick = () => {
            initAudio();
            if (isSpinning || betAmount === 3) return;
            if (credits < 3) credits = 50; 
            credits -= 3; betAmount = 3; playSound('pay'); updateDisplays();
          };
        }

        if (startBtn) {
          startBtn.onclick = () => {
            initAudio();
            if (isSpinning) return;
            if (credits < 3) credits = 50; 
            
            if (betAmount < 3) {
              credits -= 3; betAmount = 3;
            }
            gamesCount++; isSpinning = true; updateDisplays(0); playSound('lever');

            if (!bonusState) {
              const rand = Math.random();
              if (rand < (1 / 255)) bonusState = 'BIG';
              else if (rand < (2 / 255)) bonusState = 'REG';
            }

            const gogoBox = document.getElementById('gogoBox');
            if (bonusState && !isPeka && Math.random() < 0.25) {
              isPeka = true;
              if (gogoBox) gogoBox.classList.add('peka');
              playSound('gako');
            }

            reels.forEach((reel, i) => {
              reel.isSpinning = true;
              reel.isStopping = false;
              reel.speed = REEL_SPEED_BASE; 
              this.renderReelCanvas(reel, true); 
              this.spinReel(reel);
              if (stopBtns[i]) stopBtns[i].disabled = false;
            });
            updateDisplays();
          };
        }

        stopBtns.forEach((btn, index) => {
          if (!btn) return;
          btn.onclick = () => {
            const reel = reels[index];
            if (!reel.isSpinning || reel.isStopping) return;
            
            btn.disabled = true;
            playSound('stop');

            // 【完全解決ロジック】Math.floorを用いて「確実にこれから降ってくる未来のコマ」をロックオン
            const maxPos = reel.strip.length * SYMBOL_HEIGHT;
            let baseIdx = Math.floor(reel.pos / SYMBOL_HEIGHT) % reel.strip.length;
            if (baseIdx < 0) baseIdx += reel.strip.length;
            
            let targetIdx = baseIdx;

            // ボーナス成立時：最大4コマ引き込みアシスト制御
            if (bonusState) {
              const targetSym = bonusState === 'BIG' ? '7' : (index === 2 ? 'BAR' : '7');
              let found = false;

              for (let slip = 0; slip <= 4; slip++) {
                const checkIdx = (baseIdx - slip + reel.strip.length) % reel.strip.length;
                if (reel.strip[checkIdx] === targetSym) { 
                  targetIdx = checkIdx; 
                  found = true;
                  break; 
                }
              }
              if (!found) { targetIdx = baseIdx; }
            } else {
              targetIdx = baseIdx;
            }

            // 最大4コマ（0.15秒）以内で確実に停止するスナップモードへ移行
            reel.currentIndex = targetIdx;
            reel.targetPos = targetIdx * SYMBOL_HEIGHT;
            reel.isStopping = true;
          };
        });

        if (soundToggle) {
          soundToggle.onclick = () => {
            soundOn = !soundOn;
            soundToggle.textContent = soundOn ? '🔊 サウンド: ON' : '🔇 サウンド: OFF';
          };
        }
      },

      spinReel: function(reel) {
        const maxPos = reel.strip.length * SYMBOL_HEIGHT;
        const animate = () => {
          if (!reel.isSpinning) return;
          
          if (reel.isStopping) {
            let dist = (reel.pos - reel.targetPos + maxPos) % maxPos;
            
            if (dist <= reel.speed || dist < 2) {
              reel.pos = reel.targetPos;
              reel.isSpinning = false;
              reel.isStopping = false;
              cancelAnimationFrame(reel.animId);
              reel.canvas.style.transform = `translateY(-${reel.pos}px)`;
              this.renderReelCanvas(reel, false);

              if (reels.every(r => !r.isSpinning)) {
                this.onAllStopped();
              }
              return;
            } else {
              let step = Math.min(reel.speed, dist);
              reel.pos = (reel.pos - step + maxPos) % maxPos;
            }
          } else {
            reel.pos = (reel.pos - reel.speed + maxPos) % maxPos;
          }

          reel.canvas.style.transform = `translateY(-${reel.pos}px)`;
          reel.animId = requestAnimationFrame(animate);
        };
        animate();
      },

      onAllStopped: function() {
        isSpinning = false;
        betAmount = 0;
        const gogoBox = document.getElementById('gogoBox');

        if (bonusState && !isPeka) {
          isPeka = true;
          if (gogoBox) gogoBox.classList.add('peka');
          playSound('gako');
        }

        const getSym = (rIdx, offset) => {
          const strip = reels[rIdx].strip;
          return strip[(reels[rIdx].currentIndex + offset + strip.length) % strip.length];
        };

        const center = [getSym(0, 1), getSym(1, 1), getSym(2, 1)];
        let payout = 0;

        if (center.every(s => s === '7')) {
          payout = 312; bonusState = null;
          setTimeout(() => alert('🎉 BIG BONUS! (+312枚)'), 100);
        } else if (center[0] === '7' && center[1] === '7' && center[2] === 'BAR') {
          payout = 104; bonusState = null;
          setTimeout(() => alert('✨ REG BONUS! (+104枚)'), 100);
        } else {
          if (center.every(s => s === 'GRAPE')) payout = 7;
          else if (center[0] === 'CHERRY') payout = 2;
          else if (center.every(s => s === 'BELL')) payout = 14;
          else if (center.every(s => s === 'RHINO')) payout = 3;
        }

        if (!bonusState && payout >= 100 && gogoBox) {
          isPeka = false;
          gogoBox.classList.remove('peka');
        }

        if (payout > 0) {
          credits += payout;
          playSound('pay');
        }

        updateDisplays(payout);
      }
    };

    // --- 完全安全な起動スクリプト ---
    function bootEngine() {
      if (window.JUGGLER_ENGINE && !window.JUGGLER_ENGINE.isInitialized) {
        window.JUGGLER_ENGINE.init();
      }
    }

    if (document.readyState === 'complete' || document.readyState === 'interactive') {
      bootEngine();
    } else {
      window.addEventListener('DOMContentLoaded', bootEngine);
      window.addEventListener('load', bootEngine);
    }
  </script>
</body>
