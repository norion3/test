      transform: translate(-50%, -50%);
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-radius: 24px;
      padding: 35px 25px;
      text-align: center;
      color: white;
      z-index: 30;
      transition: opacity 0.3s ease, transform 0.3s ease;
      width: 85%;
      max-width: 380px;
    }
    .modal-overlay.hidden {
      opacity: 0;
      pointer-events: none;
      visibility: hidden;
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
      transform: translate(-50%, -45%);
    }

    #start-modal {
      border: 1px solid rgba(56, 189, 248, 0.4);
      box-shadow: 0 10px 40px rgba(56, 189, 248, 0.15);
      pointer-events: none; 
    }
    .rule-text {
      font-size: 16px;
      line-height: 1.8;
      margin-bottom: 28px;
      color: #bae6fd;
      text-align: center;
      font-weight: 700;
      text-shadow: 0 0 10px rgba(56, 189, 248, 0.6);
    }
    .rule-title {
      font-size: 22px;
      font-weight: 900;
      color: #38bdf8;
      margin-bottom: 12px;
      letter-spacing: 2px;
    }
    .blink-text {
      font-size: 20px;
      font-weight: 900;
      animation: blink 2.5s infinite;
      color: #38bdf8;
      letter-spacing: 3px;
      background: rgba(56, 189, 248, 0.1);
      border: 1px solid rgba(56, 189, 248, 0.5);
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.3);
      padding: 14px 28px;
      border-radius: 40px;
      display: inline-block;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.7; transform: scale(0.98); }
    }

    #game-over-modal {
      border: 1px solid rgba(255, 255, 255, 0.05);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
      pointer-events: auto;
    }
    .modal-sub { font-size: 14px; color: #fbbf24; font-weight: 800; letter-spacing: 4px; margin-bottom: 0px; }
    .modal-score { font-size: 64px; color: #fff; font-weight: 900; text-shadow: 0 4px 10px rgba(0,0,0,0.5); margin: 15px 0; }
    
    .btn {
      width: 100%;
      background: #fbbf24;
      color: #0f172a;
      border: none;
      padding: 18px 0;
      font-size: 20px;
      font-weight: 900;

      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 6px 15px rgba(251, 191, 36, 0.3);
      transition: transform 0.1s, filter 0.2s;
      margin-top: 10px;
    }
    .btn:active { transform: scale(0.96); filter: brightness(0.9); }
  </style>
</head>
<body>

<div class="ui-layer" id="ui-layer" style="opacity: 1;">
  <div class="score-val"><span id="score">0</span> FLOORS</div>
</div>

<div id="mute-btn">🔇</div>
<button id="download-html-btn">📥 main.htmlを保存</button>

<div id="start-modal" class="modal-overlay">
  <div class="rule-title">高く積み上げろ！</div>
  <div class="rule-text">
    タップでフロアを積む<br>
    はみ出た部分は崩れ落ちる<br>
    ピッタリ重ねると美しい明滅
  </div>
  <div class="blink-text">TAP TO START</div>
</div>

<div id="game-over-modal" class="modal-overlay hidden">
  <div class="modal-sub">BUILDING COMPLETE</div>
  <div class="modal-score"><span id="final-score">0</span> <span style="font-size: 24px">階</span></div>
  <button class="btn" id="restart-btn">BUILD AGAIN</button>
</div>

<canvas id="canvas" width="1290" height="2052"></canvas>

<script>
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const finalScoreEl = document.getElementById('final-score');
  const gameOverModal = document.getElementById('game-over-modal');
  const startModal = document.getElementById('start-modal');
  const uiLayer = document.getElementById('ui-layer');
  const restartBtn = document.getElementById('restart-btn');
  const muteBtn = document.getElementById('mute-btn');
  const downloadBtn = document.getElementById('download-html-btn');

  // 直接ファイルをダウンロードする機能
  if (downloadBtn) {
    downloadBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      const htmlContent = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
      const blob = new Blob([htmlContent], { type: 'text/html' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'main.html';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    });
  }

  let W, H;
  let BLOCK_H = 34;
  let BLOCK_D = 55;
  let INIT_W;

  let stack = [];
  let fallingDebris = [];
  let particles = [];
  let currentBlock = null;
  let score = 0;
  
  let gameState = 'START'; 

  let cameraY = 0;
  let targetCameraY = 0;
  let camAngle = 0.5; 
  let cinematicFrame = 0;
  let startCamY = 0;

  let stars = [];
  let clouds = [];
  let bgBuildings = [];
  let moon = { x: 0, y: 0, s: 0 };
  let airplane = null;
  let airplaneTimer = 0;
  let hasTriggeredFirstAirplane = false;

  let audioCtx = null;
  let isMuted = true;

  function initAudio() {
    if (!audioCtx) {
      window.AudioContext = window.AudioContext || window.webkitAudioContext;
      audioCtx = new AudioContext();
    }
  }

  muteBtn.addEventListener('pointerdown', (e) => {
    e.stopPropagation();
    isMuted = !isMuted;
    muteBtn.textContent = isMuted ? '🔇' : '🔈';
    if (!isMuted) {
      initAudio();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }
  });

  function playSound(type) {
    if (isMuted) return;
    initAudio();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    
    const t = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    
    if (type === 'place') {
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(250, t);
      osc.frequency.exponentialRampToValueAtTime(80, t + 0.1);
      gain.gain.setValueAtTime(0.3, t);
      gain.gain.exponentialRampToValueAtTime(0.01, t + 0.1);
      osc.start(t);
      osc.stop(t + 0.1);
    } else if (type === 'perfect') {
      osc.type = 'sine';
      osc.frequency.setValueAtTime(880, t); 
      osc.frequency.exponentialRampToValueAtTime(440, t + 0.5);
      
      const osc2 = audioCtx.createOscillator();
      osc2.type = 'sine';
      osc2.frequency.setValueAtTime(1320, t); 
      osc2.connect(gain);
      osc2.start(t);
      osc2.stop(t + 0.5);

      gain.gain.setValueAtTime(0.2, t);
      gain.gain.exponentialRampToValueAtTime(0.01, t + 0.5);
      osc.start(t);
      osc.stop(t + 0.5);
    } else if (type === 'drop') {
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(120, t);
      osc.frequency.exponentialRampToValueAtTime(30, t + 0.3);
      
      const filter = audioCtx.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.setValueAtTime(300, t);
      filter.frequency.exponentialRampToValueAtTime(100, t + 0.3);
      
      osc.disconnect();
      osc.connect(filter);
      filter.connect(gain);

      gain.gain.setValueAtTime(0.2, t);
      gain.gain.exponentialRampToValueAtTime(0.01, t + 0.3);
      osc.start(t);
      osc.stop(t + 0.3);
    } else if (type === 'over') {
      osc.type = 'sine';
      osc.frequency.setValueAtTime(150, t);
      osc.frequency.exponentialRampToValueAtTime(50, t + 1.2);
      gain.gain.setValueAtTime(0.4, t);
      gain.gain.exponentialRampToValueAtTime(0.01, t + 1.2);
      osc.start(t);
      osc.stop(t + 1.2);
    }
  }

  function seededRandom(seed) {
    let x = Math.sin(seed) * 10000;
    return x - Math.floor(x);
  }

  function initBackground() {
    stars = Array.from({length: 70}, () => ({
      x: Math.random() * (W || 500),
      y: Math.random() * (H || 800),
      s: Math.random() * 1.8 + 0.4,
      baseA: Math.random() * 0.6 + 0.3, 
      phase: Math.random() * Math.PI * 2,
      isBright: Math.random() > 0.8
    }));
    
    clouds = Array.from({length: 4}, () => ({
      x: Math.random() * (W || 500),
      y: Math.random() * (H * 0.45),
      w: 220 + Math.random() * 250,
      h: 18 + Math.random() * 25,
      speed: 0.03 + Math.random() * 0.05,
      a: 0.02 + Math.random() * 0.025
    }));

    moon = { x: W * 0.78, y: H * 0.18, s: 35 };

    let moonCoverBuildingHeight = H - moon.y + moon.s * 0.4;

    bgBuildings = [
      { x: -60, w: 90, h: 360, z: 0.03, layer: 'far', color: '#0d1629' },
      { x: 30, w: 110, h: 420, z: 0.04, layer: 'far', color: '#0e182b' },
      { x: 420, w: 100, h: 390, z: 0.035, layer: 'far', color: '#0d1629' },
      { x: 620, w: 120, h: 410, z: 0.03, layer: 'far', color: '#0c1527' },

      { x: 120, w: 65, h: 340, z: 0.12, layer: 'mid', color: '#111d33' },
      { x: 250, w: 75, h: 370, z: 0.11, layer: 'mid', color: '#122038' },
      { x: 360, w: 60, h: 320, z: 0.13, layer: 'mid', color: '#111d33' },
      { x: 530, w: 70, h: 350, z: 0.12, layer: 'mid', color: '#122038' },

      { x: -20, w: 80, h: 280, z: 0.32, layer: 'near', color: '#162540' },
      { x: 80, w: 70, h: 220, z: 0.38, layer: 'near', color: '#182948' },
      { x: 190, w: 85, h: 310, z: 0.28, layer: 'near', color: '#14223d' },
      { x: moon.x - 45, w: 90, h: moonCoverBuildingHeight, z: 0.35, layer: 'near', color: '#1a2c4e' },
      { x: 320, w: 75, h: 250, z: 0.34, layer: 'near', color: '#182948' },
      { x: 470, w: 80, h: 290, z: 0.30, layer: 'near', color: '#162540' },
      { x: 580, w: 70, h: 210, z: 0.36, layer: 'near', color: '#182948' },
      { x: 710, w: 90, h: 330, z: 0.28, layer: 'near', color: '#14223d' }
    ];

    bgBuildings.forEach(b => {
      b.windows = [];
      let winStepY = b.layer === 'far' ? 14 : (b.layer === 'mid' ? 18 : 22);
      let winStepX = b.layer === 'far' ? 8 : (b.layer === 'mid' ? 11 : 14);
      for (let wy = 15; wy < b.h - 10; wy += winStepY) {
        for (let wx = 6; wx < b.w - 6; wx += winStepX) {
          if (Math.random() > 0.45) b.windows.push({ x: wx, y: wy });
        }
      }
    });

    bgBuildings.sort((a, b) => a.z - b.z);
  }

  function resize() {
    W = window.innerWidth;
    H = window.innerHeight;
    const dpr = window.devicePixelRatio || 1;
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    ctx.scale(dpr, dpr);
    INIT_W = Math.min(W * 0.75, 320); 

    if (gameState === 'START' && stack.length > 0 && currentBlock) {
      INIT_W = Math.min(W * 0.75, 320);
      stack[0].w = INIT_W;
      stack[0].x = (W - INIT_W) / 2;
      stack[0].y = H - BLOCK_H - 60;
      
      if (stack[0].foundation) {
        stack[0].foundation.w = INIT_W + 30;
        stack[0].foundation.d = BLOCK_D + 20;
        stack[0].foundation.x = stack[0].x - 15;
      }

      currentBlock.w = INIT_W;
      currentBlock.x = (W - INIT_W) / 2;
      currentBlock.y = stack[0].y - BLOCK_H;
      updateCamera();
      cameraY = targetCameraY;
      
      initBackground();
    }
  }
  window.addEventListener('resize', resize);

  function poly(ctx, points, fillStyle, strokeStyle, lineWidth = 1) {
    ctx.beginPath();
    ctx.moveTo(points[0][0], points[0][1]);
    for (let i = 1; i < points.length; i++) ctx.lineTo(points[i][0], points[i][1]);
    ctx.closePath();
    if (fillStyle && fillStyle !== 'transparent') {
      ctx.fillStyle = fillStyle;
      ctx.fill();
    }
    if (strokeStyle && strokeStyle !== 'transparent') {
      ctx.strokeStyle = strokeStyle;
      ctx.lineWidth = lineWidth;
      ctx.stroke();
    }
  }

  function drawBuildingFloor(ctx, x, y, w, h, d, angle, seed, time, flash = 0, isPerfect = false, isFoundation = false) {
    const cx = W / 2;
    const cz = d / 2;

    const rot = (px, pz) => ({
      x: cx + (px - cx) * Math.cos(angle) - (pz - cz) * Math.sin(angle),
      z: cz + (pz - cz) * Math.cos(angle) + (px - cx) * Math.sin(angle)
    });

    const to2D = (p, py) => [p.x, py - p.z * 0.5];

    const p00 = rot(x, 0);
    const p10 = rot(x+w, 0);
    const p11 = rot(x+w, d);
    const p01 = rot(x, d);

    const A = to2D(p00, y);
    const B = to2D(p10, y);
    const C = to2D(p10, y + h);
    const D = to2D(p00, y + h);
    const E = to2D(p01, y);
    const F = to2D(p11, y);
    const G = to2D(p11, y + h);
    const H = to2D(p01, y + h);

    let normFront = Math.max(0.1, 0.7 - 0.5 * Math.sin(angle));
    let normBack  = Math.max(0.1, 0.7 + 0.5 * Math.sin(angle));
    let normRight = Math.max(0.1, 0.7 + 0.5 * Math.cos(angle));
    let normLeft  = Math.max(0.1, 0.7 - 0.5 * Math.cos(angle));

    poly(ctx, [D, C, G, H], 'rgba(0,0,0,0.7)', null);

    const sides = [
      { id: 0, pts: [F, E, H, G], norm: normBack,  O: {x:x+w, y, z:d}, dU: {x:-1, z:0}, dV: {y:1}, lenU: w, lenV: h },
      { id: 1, pts: [A, B, C, D], norm: normFront, O: {x, y, z:0}, dU: {x:1,  z:0}, dV: {y:1}, lenU: w, lenV: h },
      { id: 2, pts: [E, A, D, H], norm: normLeft,  O: {x, y, z:d}, dU: {x:0,  z:-1}, dV: {y:1}, lenU: d, lenV: h },
      { id: 3, pts: [B, F, G, C], norm: normRight, O: {x:x+w, y, z:0}, dU: {x:0,  z:1}, dV: {y:1}, lenU: d, lenV: h }
    ];

    const baseHue = 215; 

    for (let side of sides) {
      const p = side.pts;
      const cross = (p[1][0] - p[0][0]) * (p[2][1] - p[1][1]) - (p[1][1] - p[0][1]) * (p[2][0] - p[1][0]);
      
      if (cross > 0) {
        const wallLight = side.norm * 30 + (isFoundation ? 15 : 30);
        const grad = ctx.createLinearGradient(p[0][0], p[0][1], p[3][0], p[3][1]);
        grad.addColorStop(0, `hsl(${baseHue}, 15%, ${wallLight}%)`);
        grad.addColorStop(1, `hsl(${baseHue}, 15%, ${Math.max(10, wallLight - 10)}%)`);
        const edgeColor = `hsl(${baseHue}, 20%, 15%)`; 
        
        poly(ctx, p, grad, edgeColor, 1.5);

        if (side.id === 3 || side.id === 1) {
          const moonHighlight = ctx.createLinearGradient(p[1][0], p[1][1], p[0][0], p[0][1]);
          moonHighlight.addColorStop(0, 'rgba(254, 240, 138, 0.16)');
          moonHighlight.addColorStop(0.6, 'rgba(254, 240, 138, 0.03)');
          moonHighlight.addColorStop(1, 'rgba(0, 0, 0, 0)');
          poly(ctx, p, moonHighlight, null);
        }

        if (isFoundation) continue;

        const slabLight = wallLight - 10;
        const slabGrad = ctx.createLinearGradient(p[0][0], p[0][1], p[1][0], p[1][1]);
        slabGrad.addColorStop(0, `hsl(${baseHue}, 10%, ${slabLight}%)`);
        slabGrad.addColorStop(1, `hsl(${baseHue}, 10%, ${Math.max(5, slabLight - 10)}%)`);

        const slabH = 3.5;
        let s0 = to2D(rot(side.O.x, side.O.z), side.O.y);
        let s1 = to2D(rot(side.O.x + side.dU.x*side.lenU, side.O.z + side.dU.z*side.lenU), side.O.y);
        let s2 = to2D(rot(side.O.x + side.dU.x*side.lenU, side.O.z + side.dU.z*side.lenU), side.O.y + slabH);
        let s3 = to2D(rot(side.O.x, side.O.z), side.O.y + slabH);
        poly(ctx, [s0, s1, s2, s3], slabGrad, edgeColor, 0.5);

        s0 = to2D(rot(side.O.x, side.O.z), side.O.y + h - slabH);
        s1 = to2D(rot(side.O.x + side.dU.x*side.lenU, side.O.z + side.dU.z*side.lenU), side.O.y + h - slabH);
        s2 = to2D(rot(side.O.x + side.dU.x*side.lenU, side.O.z + side.dU.z*side.lenU), side.O.y + h);
        s3 = to2D(rot(side.O.x, side.O.z), side.O.y + h);
        poly(ctx, [s0, s1, s2, s3], slabGrad, edgeColor, 0.5);

        const winSpacing = 18;
        const winW = 9;
        const winH = h - slabH*2 - 8; 
        const winY = slabH + 4;
        let numWins = Math.floor(side.lenU / winSpacing);
        let offsetU = (side.lenU - (numWins * winSpacing - (winSpacing - winW))) / 2;
        if (numWins === 0 && side.lenU > winW + 2) {
          numWins = 1; offsetU = (side.lenU - winW) / 2;
        }

        const winHue = 40; 
        
        for(let i=0; i<numWins; i++) {
          let u0 = offsetU + i * winSpacing;
          let u1 = u0 + winW;
          let v0 = winY;
          let v1 = winY + winH;
          
          let w0 = to2D(rot(side.O.x + side.dU.x*u0, side.O.z + side.dU.z*u0), side.O.y + side.dV.y*v0);
          let w1 = to2D(rot(side.O.x + side.dU.x*u1, side.O.z + side.dU.z*u1), side.O.y + side.dV.y*v0);
          let w2 = to2D(rot(side.O.x + side.dU.x*u1, side.O.z + side.dU.z*u1), side.O.y + side.dV.y*v1);
          let w3 = to2D(rot(side.O.x + side.dU.x*u0, side.O.z + side.dU.z*u0), side.O.y + side.dV.y*v1);
          
          let winHash = seededRandom(seed + side.id * 10 + i);
          let isOn = isPerfect ? true : (winHash > 0.45); 

          let winGrad = ctx.createLinearGradient(w0[0], w0[1], w2[0], w2[1]);

          if (isOn) {
            if (isPerfect) {
              let cycle = (Math.sin(time * 0.0012) + 1) / 2; 
              let lTop = cycle * 75; 
              let lBtm = Math.max(0, lTop - 12);
              winGrad.addColorStop(0, `hsl(${winHue}, 90%, ${lTop}%)`);
              winGrad.addColorStop(1, `hsl(${winHue}, 90%, ${lBtm}%)`);
            } else {
              let lTop = side.norm * 20 + 60;
              let lBtm = lTop - 10;
              winGrad.addColorStop(0, `hsl(${winHue}, 90%, ${lTop}%)`);
              winGrad.addColorStop(1, `hsl(${winHue}, 90%, ${lBtm}%)`);
            }
          } else {
            let winColorOff = `hsl(${baseHue}, 20%, ${side.norm * 10 + 10}%)`;
            winGrad.addColorStop(0, `hsl(${baseHue}, 20%, 15%)`); 
            winGrad.addColorStop(1, winColorOff);
          }

          poly(ctx, [w0, w1, w2, w3], winGrad, edgeColor, 0.8);

          if(!isOn && side.norm > 0.4) {
             ctx.strokeStyle = 'rgba(255,255,255,0.05)';
             ctx.beginPath(); ctx.moveTo(w0[0], w0[1]+2); ctx.lineTo(w1[0]-2, w2[1]); ctx.stroke();
          }
        }
      }
    }

    if (!isFoundation) {
      const topLight = 40;
      const topColor = `hsl(${baseHue}, 10%, ${topLight}%)`;
      poly(ctx, [E, F, B, A], topColor, topColor, 1.5);
      poly(ctx, [E, F, B, A], 'transparent', `hsl(${baseHue}, 15%, 20%)`, 1);

      const topMoonGrad = ctx.createLinearGradient(F[0], F[1], E[0], E[1]);
      topMoonGrad.addColorStop(0, 'rgba(254, 240, 138, 0.22)');
      topMoonGrad.addColorStop(0.5, 'rgba(254, 240, 138, 0.04)');
      topMoonGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');
      poly(ctx, [E, F, B, A], topMoonGrad, null);
    }

    if (flash > 0) {
      ctx.globalCompositeOperation = 'lighter';
      ctx.fillStyle = `rgba(255, 255, 255, ${flash * 0.35})`;
      poly(ctx, [E, F, B, A], ctx.fillStyle, null);
       for (let side of sides) {
        const p = side.pts;
        const cross = (p[1][0] - p[0][0]) * (p[2][1] - p[1][1]) - (p[1][1] - p[0][1]) * (p[2][0] - p[1][0]);
        if (cross > 0) poly(ctx, p, ctx.fillStyle, null);
      }
      ctx.globalCompositeOperation = 'source-over';
    }
  }

  class Block {
    constructor(x, y, w, speed = 0, isPerfect = false, isFoundation = false) {
      this.x = x;
      this.y = y;
      this.w = w;
      this.speed = speed;
      this.direction = 1;
      this.flash = 0;
      this.isPerfect = isPerfect;
      this.isFoundation = isFoundation;
      this.seed = Math.random() * 10000;
    }
    update() {
      if (this.speed !== 0) {
        let currentSpeed = this.speed;
        if (score >= 15) {
          let windEffect = Math.sin(Date.now() * 0.0028 + this.y * 0.05) * (1.2 + Math.min(score - 15, 25) * 0.08);
          currentSpeed = Math.max(1.8, this.speed + windEffect);
        }
        
        this.x += currentSpeed * this.direction;
        if (this.x <= 15) { this.x = 15; this.direction = 1; }
        else if (this.x + this.w >= W - 15) { this.x = W - 15 - this.w; this.direction = -1; }
      }
      if (this.flash > 0) this.flash -= 0.05;
    }
    draw(ctx, camY, camA, time) {
      if (this.y + camY > H + 150 || this.y + camY < -100) return;
      let h = this.isFoundation ? 45 : BLOCK_H;
      let d = this.isFoundation ? BLOCK_D + 20 : BLOCK_D;
      drawBuildingFloor(ctx, this.x, this.y + camY, this.w, h, d, camA, this.seed, time, Math.max(0, this.flash), this.isPerfect, this.isFoundation);
    }
  }

  class Debris {
    constructor(x, y, w, seed, vx, isPerfect = false) {
      this.x = x;
      this.y = y;
      this.w = w;
      this.seed = seed;
      this.vx = vx + (Math.random() - 0.5) * 2;
      this.vy = -2 - Math.random() * 2;
      this.gravity = 0.5;
      this.rot = (Math.random() - 0.5) * 0.15;
      this.isPerfect = isPerfect;
    }
    update() {
      this.vy += this.gravity;
      this.x += this.vx;
      this.y += this.vy;
    }
    draw(ctx, camY, camA, time) {
      if (this.y + camY > H + 100) return;
      drawBuildingFloor(ctx, this.x, this.y + camY, this.w, BLOCK_H, BLOCK_D, camA + this.rot, this.seed, time, 0, this.isPerfect, false);
    }
  }

  class Particle {
    constructor(x, y) {
      this.x = x;
      this.y = y;
      this.vx = (Math.random() - 0.5) * 6;
      this.vy = (Math.random() - 0.5) * 6 - 2;
      this.life = 1.0;
      this.size = Math.random() * 2 + 1.5;
    }
    update() {
      this.x += this.vx;
      this.y += this.vy;
      this.vy += 0.15;
      this.life -= 0.03;
    }
    draw(ctx, camY) {
      if(this.life <= 0) return;
      ctx.fillStyle = `rgba(251, 191, 36, ${this.life})`;
      ctx.beginPath();
      ctx.arc(this.x, this.y + camY, this.size, 0, Math.PI*2);
      ctx.fill();
    }
  }

  let isGameInitialized = false;

  function initGame() {
    if (window.innerWidth === 0 || window.innerHeight === 0) return;

    if (!isGameInitialized) {
      W = window.innerWidth;
      H = window.innerHeight;
      INIT_W = Math.min(W * 0.75, 320); 
    }

    stack = [];
    fallingDebris = [];
    particles = [];
    score = 0;
    gameState = 'START';
    cinematicFrame = 0;
    camAngle = 0.5;
    airplane = null;
    airplaneTimer = 0;
    hasTriggeredFirstAirplane = false;
    
    scoreEl.textContent = score;
    gameOverModal.classList.add('hidden');
    startModal.classList.remove('hidden');
    uiLayer.style.opacity = 1;

    if (stars.length === 0) initBackground();

    const foundationX = (W - (INIT_W + 30)) / 2;
    const foundationY = H - 65;
    const foundation = new Block(foundationX, foundationY, INIT_W + 30, 0, false, true);
    stack.push(foundation);

    const firstFloorY = foundationY - BLOCK_H;
    const firstBlock = new Block((W - INIT_W) / 2, firstFloorY, INIT_W, 0, false, false);
    firstBlock.foundation = foundation;
    stack.push(firstBlock);

    const newY = firstBlock.y - BLOCK_H;
    currentBlock = new Block((W - INIT_W) / 2, newY, INIT_W, 0);

    updateCamera();
    cameraY = targetCameraY; 
    isGameInitialized = true;
  }

  function startGame() {
    if (!isGameInitialized) return;
    gameState = 'PLAYING';
    startModal.classList.add('hidden');
    currentBlock.speed = 4.0;
  }

  function spawnNextBlock() {
    const prev = stack[stack.length - 1];
    const newY = prev.y - BLOCK_H;
    const speed = Math.min(4.0 + score * 0.10, 8.5);
    currentBlock = new Block(15, newY, prev.w, speed);
  }

  function updateCamera() {
    if (!currentBlock) return;
    targetCameraY = Math.max(0, (H * 0.6) - currentBlock.y); 
  }

  function placeBlock() {
    if (!currentBlock) return;

    const prev = stack[stack.length - 1];
    const diff = currentBlock.x - prev.x;
    const overlap = currentBlock.w - Math.abs(diff);

    if (overlap <= 0) {
      playSound('drop');
      playSound('over');
      fallingDebris.push(new Debris(currentBlock.x, currentBlock.y, currentBlock.w, currentBlock.seed, currentBlock.speed * currentBlock.direction * 0.7));
      triggerGameOver();
      return;
    }

    let newX = diff > 0 ? currentBlock.x : prev.x;
    let newWidth = overlap;

    if (Math.abs(diff) <= 4) {
      newX = prev.x;
      newWidth = prev.w;
      playSound('perfect');
      
      const pb = new Block(newX, currentBlock.y, newWidth, 0, true);
      pb.seed = currentBlock.seed; 
      pb.flash = 0.8; 
      stack.push(pb);

      for(let i=0; i<15; i++){
        particles.push(new Particle(newX + Math.random()*newWidth, currentBlock.y + BLOCK_H/2));
      }
    } else {
      playSound('place');
      playSound('drop');
      
      let debrisX = diff > 0 ? currentBlock.x + overlap : currentBlock.x;
      let debrisWidth = currentBlock.w - overlap;
      fallingDebris.push(new Debris(debrisX, currentBlock.y, debrisWidth, currentBlock.seed, diff > 0 ? 3.5 : -3.5));
      
      const nb = new Block(newX, currentBlock.y, newWidth, 0, false);
      nb.seed = currentBlock.seed;
      stack.push(nb);
    }

    score++;
    scoreEl.textContent = score;

    if (!hasTriggeredFirstAirplane && score >= 12) {
      hasTriggeredFirstAirplane = true;
      spawnAirplane();
    } else if (hasTriggeredFirstAirplane && !airplane) {
      airplaneTimer++;
      if (airplaneTimer > 350 && Math.random() < 0.015) {
        spawnAirplane();
        airplaneTimer = 0;
      }
    }

    spawnNextBlock();
    updateCamera();
  }

  function spawnAirplane() {
    let dist = 260;
    let slope = -0.5; 
    let startX = moon.x - dist;
    let startY = moon.y - dist * slope; 
    let targetX = moon.x + dist;
    let targetY = moon.y + dist * slope; 

    let dx = targetX - startX;
    let dy = targetY - startY;
    let angle = Math.atan2(dy, dx);
    let speed = 0.55; 

    airplane = {
      x: startX,
      y: startY,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      angle: angle,
      scale: 0.85
    };
  }

  function triggerGameOver() {
    gameState = 'SHOWCASE';
    currentBlock = null;
    cinematicFrame = 0;
    startCamY = cameraY;
    uiLayer.style.opacity = 0;
    finalScoreEl.textContent = score;
  }

  function drawCrane(ctx, camY) {
    let craneX = W * 0.92; 
    let craneBaseY = stack[0].y + BLOCK_H; 
    let craneTopY = (currentBlock ? currentBlock.y : stack[stack.length-1].y) - 200; 

    let renderBaseY = craneBaseY + camY;
    let renderTopY = craneTopY + camY;

    if (renderBaseY < -100 || renderTopY > H + 100) return;

    ctx.save();
    
    const mastW = 24;
    
    let mastGrad = ctx.createLinearGradient(craneX, 0, craneX + mastW, 0);
    mastGrad.addColorStop(0, '#c2410c');
    mastGrad.addColorStop(0.5, '#ea580c');
    mastGrad.addColorStop(1, '#9a3412');

    ctx.fillStyle = mastGrad;
    ctx.fillRect(craneX, renderTopY, mastW, renderBaseY - renderTopY);
    
    ctx.strokeStyle = '#78350f';
    ctx.lineWidth = 2;
    ctx.beginPath();
    for (let y = renderTopY; y < renderBaseY; y += mastW) {
      ctx.moveTo(craneX, y); ctx.lineTo(craneX + mastW, y + mastW);
      ctx.moveTo(craneX + mastW, y); ctx.lineTo(craneX, y + mastW);
      ctx.moveTo(craneX, y); ctx.lineTo(craneX + mastW, y); 
    }
    ctx.stroke();

    ctx.fillStyle = '#1e293b';
    ctx.fillRect(craneX - 22, renderTopY + 30, 22, 28); 
    let winGrad = ctx.createLinearGradient(craneX-20, renderTopY+33, craneX-8, renderTopY+48);
    winGrad.addColorStop(0, '#94a3b8');
    winGrad.addColorStop(1, '#475569');
    ctx.fillStyle = winGrad;
    ctx.fillRect(craneX - 20, renderTopY + 33, 12, 15);

    ctx.fillStyle = mastGrad;
    ctx.fillRect(craneX - 15, renderTopY + 58, mastW + 30, 18);

    ctx.translate(craneX + mastW/2, renderTopY + 25);
    ctx.rotate(Math.PI / 32); 

    const jibL = 170; 
    const tailL = 50;
    const jibH = 16;
    
    let jibGrad = ctx.createLinearGradient(0, -jibH/2, 0, jibH/2);
    jibGrad.addColorStop(0, '#f97316');
    jibGrad.addColorStop(1, '#9a3412');

    ctx.fillStyle = jibGrad;
    ctx.fillRect(-jibL, -jibH/2, jibL + tailL, jibH);
    
    ctx.strokeStyle = '#78350f';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    for (let x = -jibL; x < tailL - jibH; x += jibH) {
      ctx.moveTo(x, -jibH/2); ctx.lineTo(x + jibH, jibH/2);
      ctx.moveTo(x + jibH, -jibH/2); ctx.lineTo(x, jibH/2);
    }
    ctx.stroke();

    ctx.fillStyle = '#334155';
    ctx.fillRect(tailL - 30, -jibH/2 - 15, 30, 45);

    ctx.rotate(-Math.PI / 32); 
    ctx.strokeStyle = '#cbd5e1';
    ctx.lineWidth = 1;
    ctx.beginPath();
    let wireX = -jibL * 0.85 * Math.cos(Math.PI/32);
    let wireY = -jibL * 0.85 * Math.sin(Math.PI/32);
    
    ctx.moveTo(wireX - 2, wireY); ctx.lineTo(wireX - 2, wireY + 120); 
    ctx.moveTo(wireX + 2, wireY); ctx.lineTo(wireX + 2, wireY + 120); 
    ctx.stroke();

    ctx.fillStyle = '#eab308';
    ctx.fillRect(wireX - 8, wireY + 120, 16, 14);
    ctx.fillStyle = '#334155';
    ctx.beginPath();
    ctx.arc(wireX, wireY + 138, 6, Math.PI, 0);
    ctx.stroke();

    ctx.restore();
  }

  function drawBackground(ctx, camY, time) {
    let bgGrad = ctx.createLinearGradient(0, 0, 0, H);
    bgGrad.addColorStop(0.0, '#091833'); 
    bgGrad.addColorStop(0.5, '#13284f'); 
    bgGrad.addColorStop(1.0, '#1f396b'); 
    ctx.fillStyle = bgGrad;
    ctx.fillRect(0, 0, W, H);

    let haloGrad = ctx.createRadialGradient(moon.x, moon.y, moon.s * 0.5, moon.x, moon.y, moon.s * 3.5);
    haloGrad.addColorStop(0, 'rgba(254, 240, 138, 0.35)');
    haloGrad.addColorStop(0.5, 'rgba(253, 224, 71, 0.1)');
    haloGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');
    ctx.fillStyle = haloGrad;
    ctx.beginPath();
    ctx.arc(moon.x, moon.y, moon.s * 3.5, 0, Math.PI * 2);
    ctx.fill();

    ctx.save();
    ctx.shadowColor = '#fde047';
    ctx.shadowBlur = 25;
    ctx.fillStyle = '#fef08a';
    ctx.beginPath();
    ctx.arc(moon.x, moon.y, moon.s, 0, Math.PI*2);
    ctx.fill();
    ctx.restore();

    ctx.fillStyle = 'rgba(234, 179, 8, 0.25)';
    ctx.beginPath();
    ctx.arc(moon.x - 8, moon.y - 6, 6, 0, Math.PI * 2);
    ctx.arc(moon.x + 10, moon.y + 8, 4.5, 0, Math.PI * 2);
    ctx.arc(moon.x - 5, moon.y + 12, 3.5, 0, Math.PI * 2);
    ctx.fill();

    stars.forEach(star => {
      let alpha = star.baseA + Math.sin(time * 0.0015 + star.phase) * 0.25;
      let renderY = (star.y + camY * 0.1) % H; 
      ctx.fillStyle = star.isBright ? `rgba(255, 255, 255, ${Math.max(0.2, alpha + 0.2)})` : `rgba(255, 255, 255, ${Math.max(0, alpha)})`;
      ctx.fillRect(star.x, renderY, star.s, star.s);
      
      if(star.isBright) {
        ctx.fillStyle = `rgba(255, 255, 255, ${alpha * 0.5})`;
        ctx.fillRect(star.x - 2, renderY, star.s + 4, 0.8);
        ctx.fillRect(star.x, renderY - 2, 0.8, star.s + 4);
      }
    });

    if (airplane) {
      airplane.x += airplane.vx;
      airplane.y += airplane.vy;
      let planeRenderY = airplane.y; 
      
      ctx.save();
      ctx.translate(airplane.x, planeRenderY);
      ctx.rotate(airplane.angle);
      ctx.scale(airplane.scale, airplane.scale);

      ctx.fillStyle = '#070d19';
      
      ctx.beginPath();
      ctx.moveTo(22, 0);
      ctx.quadraticCurveTo(16, -4, -18, -3.5);
      ctx.lineTo(-24, -11); 
      ctx.lineTo(-28, -11);
      ctx.lineTo(-23, -1);
      ctx.lineTo(-27, 1);
      ctx.quadraticCurveTo(-18, 4, 22, 0);
      ctx.closePath();
      ctx.fill();

      ctx.beginPath();
      ctx.moveTo(4, 0);
      ctx.lineTo(-8, -22);
      ctx.lineTo(-13, -22);
      ctx.lineTo(-3, 0);
      ctx.lineTo(-13, 22);
      ctx.lineTo(-8, 22);
      ctx.closePath();
      ctx.fill();

      ctx.beginPath();
      ctx.moveTo(-18, 0);
      ctx.lineTo(-24, -8);
      ctx.lineTo(-27, -8);
      ctx.lineTo(-23, 0);
      ctx.lineTo(-27, 8);
      ctx.lineTo(-24, 8);
      ctx.closePath();
      ctx.fill();

      let blink = Math.sin(time * 0.005) > 0;
      if (blink) {
        ctx.save();
        ctx.shadowColor = '#ef4444';
        ctx.shadowBlur = 8;
        ctx.fillStyle = '#f87171';
        ctx.beginPath();
        ctx.arc(-10, -22, 2.2, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        ctx.save();
        ctx.shadowColor = '#10b981';
        ctx.shadowBlur = 8;
        ctx.fillStyle = '#34d399';
        ctx.beginPath();
        ctx.arc(-10, 22, 2.2, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      ctx.restore();

      if (airplane.x > W + 200 || airplane.y < -150) {
        airplane = null;
      }
    }

    clouds.forEach(cloud => {
      cloud.x -= cloud.speed;
      if (cloud.x + cloud.w < 0) cloud.x = W;
      
      let renderY = (cloud.y + camY * 0.05) % H;
      let cloudGrad = ctx.createLinearGradient(cloud.x, renderY - cloud.h, cloud.x, renderY + cloud.h);
      cloudGrad.addColorStop(0, 'rgba(255, 255, 255, 0)');
      cloudGrad.addColorStop(0.5, `rgba(255, 255, 255, ${cloud.a})`);
      cloudGrad.addColorStop(1, 'rgba(255, 255, 255, 0)');
      
      ctx.fillStyle = cloudGrad;
      ctx.beginPath();
      ctx.ellipse(cloud.x, renderY, cloud.w, cloud.h, 0, 0, Math.PI*2);
      ctx.fill();
    });

    bgBuildings.forEach(b => {
      let dynamicZ = b.z * (1.0 + Math.min(1.8, score * 0.04));
      let by = H - b.h + camY * dynamicZ;
      if (by > H) return;
      
      let bGrad = ctx.createLinearGradient(b.x, by, b.x, H);
      bGrad.addColorStop(0, b.color);
      bGrad.addColorStop(1, '#091222');
      
      ctx.fillStyle = bGrad;
      ctx.fillRect(b.x, by, b.w, H - by);

      ctx.strokeStyle = 'rgba(255, 255, 255, 0.04)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(b.x, by);
      ctx.lineTo(b.x, H);
      ctx.stroke();

      let winW = b.layer === 'far' ? 2 : (b.layer === 'mid' ? 2.5 : 3);
      let winH = b.layer === 'far' ? 3 : (b.layer === 'mid' ? 4 : 5);
      let winAlpha = b.layer === 'far' ? 0.18 : (b.layer === 'mid' ? 0.28 : 0.38);

      ctx.fillStyle = `hsla(45, 85%, 60%, ${winAlpha})`;
      b.windows.forEach(win => {
        if (by + win.y < H) {
           ctx.fillRect(b.x + win.x, by + win.y, winW, winH);
        }
      });
    });
  }

  function gameLoop() {
    if (!isGameInitialized) {
      if (window.innerWidth > 0 && window.innerHeight > 0) {
        resize();
        initGame();
      }
      requestAnimationFrame(gameLoop);
      return;
    }

    let time = Date.now();
    drawBackground(ctx, cameraY, time);

    if (gameState === 'SHOWCASE') {
      cinematicFrame++;
      
      let durationFactor = Math.min(2.0, Math.max(0.8, score / 15));
      
      let bottomCamY = Math.max(0, H * 0.85 - stack[0].y);
      let topCamY = Math.max(0, (H * 0.6) - stack[stack.length - 1].y);

      let phase1End = Math.floor(120 * durationFactor);
      let phase2End = Math.floor(360 * durationFactor);

      if (cinematicFrame > 30 && cinematicFrame <= 30 + phase1End) {
        let t = (cinematicFrame - 30) / phase1End;
        let ease = t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t;
        cameraY = startCamY + (bottomCamY - startCamY) * ease;
      } 
      else if (cinematicFrame > 30 + phase1End && cinematicFrame <= phase2End) {
        let t = (cinematicFrame - (30 + phase1End)) / (phase2End - (30 + phase1End));
        let ease = t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t;
        cameraY = bottomCamY + (topCamY - bottomCamY) * ease;
        camAngle = 0.5 + (Math.PI * 1.0) * ease;
      }
      else if (cinematicFrame > phase2End) {
        let rotationSpeed = Math.max(0.001, 0.0025 / durationFactor); 
        camAngle += rotationSpeed; 
        if (cinematicFrame === phase2End + 1) gameOverModal.classList.remove('hidden');
      }
    } else if (gameState === 'PLAYING') {
      cameraY += (targetCameraY - cameraY) * 0.12;
    } else if (gameState === 'START') {
      cameraY = targetCameraY; 
    }

    drawCrane(ctx, cameraY);

    let renderList = [];
    for (let i = 0; i < stack.length; i++) {
      stack[i].update(); 
      renderList.push(stack[i]);
    }
    
    for (let i = fallingDebris.length - 1; i >= 0; i--) {
      fallingDebris[i].update();
      renderList.push(fallingDebris[i]);
      if (fallingDebris[i].y + cameraY > H + 200) fallingDebris.splice(i, 1);
    }
    
    if ((gameState === 'PLAYING' || gameState === 'START') && currentBlock) {
      if (gameState === 'PLAYING') currentBlock.update();
      renderList.push(currentBlock);
    }

    renderList.sort((a, b) => b.y - a.y);

    for (let item of renderList) {
      item.draw(ctx, cameraY, camAngle, time);
    }

    for (let i = particles.length - 1; i >= 0; i--) {
      particles[i].update();
      particles[i].draw(ctx, cameraY);
      if (particles[i].life <= 0) particles.splice(i, 1);
    }

    requestAnimationFrame(gameLoop);
  }

  window.addEventListener('pointerdown', (e) => {
    if (e.target.closest('#mute-btn')) return; 
    if (e.target.closest('#game-over-modal')) return;
    if (e.target.closest('#download-html-btn')) return;
    
    if (gameState === 'START') startGame();
    else if (gameState === 'PLAYING') placeBlock();
  });

  window.addEventListener('keydown', (e) => {
    if (e.code === 'Space') { 
      e.preventDefault();
      if (gameState === 'START') startGame();
      else if (gameState === 'PLAYING') placeBlock();
    }
  });

  restartBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    isGameInitialized = false; 
    initGame();
  });

  let startupTriggered = false;
  function startUp() {
    if (startupTriggered) return;
    startupTriggered = true;
    resize();
    initGame();
    requestAnimationFrame(gameLoop);
  }

  window.addEventListener('load', startUp);
  setTimeout(startUp, 200); 
</script>

</body></html>
